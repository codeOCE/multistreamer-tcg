<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0f0d;
            color: #fcfaf7;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full text-center space-y-8">
        <div class="text-6xl mb-4">🌀</div>
        <h1 class="text-4xl font-black uppercase tracking-tighter italic">Entity Missing</h1>
        <p class="text-void-muted leading-relaxed">The requested creator is not present in the current network
            configuration.</p>
        <a href="/"
            class="inline-block px-8 py-4 bg-void-accent text-white rounded-xl font-bold uppercase tracking-widest text-[10px] hover:scale-105 transition-all">Return
            Home</a>
    </div>
    <script>
        // Set void accent color for tailwind
        window.tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'void-accent': '#3498db',
                        'void-muted': '#4a5568'
                    }
                }
            }
        }
    </script>
</body>

</html>
