<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="castle-public-url" content="https://tcg.creatorcastle.gg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Magic Dust · Castle TCG</title>
  <link rel="icon" type="image/png" href="https://cdn.codeoce.com/logo/logo_white.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;600;800&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07080c;
      color: #e8eaf0;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Starfield ── */
    #stars {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,.55), transparent),
        radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.45), transparent),
        radial-gradient(1px 1px at 42% 78%, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at 93% 55%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 6%  68%, rgba(255,255,255,.35), transparent),
        radial-gradient(1px 1px at 55% 90%, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at 27% 44%, rgba(255,255,255,.3), transparent),
        radial-gradient(1px 1px at 88% 80%, rgba(255,255,255,.45), transparent),
        radial-gradient(1.5px 1.5px at 33% 8%,  rgba(255,255,255,.6), transparent),
        radial-gradient(1.5px 1.5px at 67% 35%, rgba(255,255,255,.5), transparent),
        radial-gradient(1.5px 1.5px at 11% 90%, rgba(255,255,255,.45), transparent),
        radial-gradient(2px 2px at 50% 50%, rgba(200,180,255,.15), transparent);
    }

    /* ── Ambient portal glow ── */
    #bg-glow {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 55% at 50% 45%, rgba(255,255,255,.02) 0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 50% 45%, rgba(10,10,16,.18) 0%, transparent 55%);
      transition: background 1s ease;
    }
    body.burning #bg-glow {
      background:
        radial-gradient(ellipse 70% 60% at 50% 45%, rgba(255,80,5,.22) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 45%, rgba(10,10,16,.18) 0%, transparent 50%);
    }

    /* ── Full-screen flash ── */
    #flash {
      position: fixed; inset: 0; z-index: 9998; pointer-events: none;
      background: #39ff6e; opacity: 0; transition: opacity .06s;
    }

    /* ── Dust balance chip ── */
    #dust-chip {
      position: fixed; top: 98px; right: 18px; z-index: 600;
      padding: 8px 16px; border-radius: 99px;
      background: rgba(57,255,110,.07); border: 1px solid rgba(57,255,110,.2);
      font-size: .52rem; font-weight: 900; letter-spacing: .18em;
      text-transform: uppercase; color: rgba(57,255,110,.85);
      display: flex; align-items: center; gap: 8px; transition: all .4s;
    }
    #dust-chip.glow {
      background: rgba(57,255,110,.18);
      border-color: rgba(57,255,110,.55);
      box-shadow: 0 0 30px rgba(57,255,110,.35);
    }

    /* ── Main layout ── */
    #main {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
    }

    /* ── Anvil scene (anvil + forge, scales as one) ── */
    #anvil-scene {
      position: relative;
      flex-shrink: 0;
      width: min(640px, 94vw);
      aspect-ratio: 470 / 380;
      max-height: 66vh;
    }
    #anvil-svg {
      display: block;
      width: 100%; height: 100%;
      overflow: visible;
      shape-rendering: geometricPrecision;
    }

    /* Forge flame flicker (SVG paths) */
    .forge-flame { transform-box: fill-box; transform-origin: 50% 100%;
      animation: forge-flicker .55s ease-in-out infinite alternate; }
    .forge-flame.f2 { animation-delay: .13s; animation-duration: .47s; }
    .forge-flame.f3 { animation-delay: .26s; animation-duration: .62s; }
    @keyframes forge-flicker {
      from { transform: scaleY(.82) scaleX(1.04) translateY(2px); opacity: .8; }
      to   { transform: scaleY(1.14) scaleX(.95) translateY(-2px); opacity: 1; }
    }

    /* Card laid on the anvil top face. Lives inside an SVG <foreignObject>
       so it scales with the scene and sits in the slab's perspective plane. */
    #card-slot {
      position: relative;
      width: 100%; height: 100%;
      background: #0a0a0e;
      border: 2px solid rgba(0,0,0,.55);
      border-radius: 5px;
      overflow: hidden; cursor: pointer;
      box-shadow: inset 0 0 22px rgba(0,0,0,.85), 0 2px 6px rgba(0,0,0,.5);
      transition: box-shadow .3s;
    }
    body.has-card #card-slot {
      box-shadow: inset 0 0 14px rgba(0,0,0,.6), 0 0 18px rgba(57,255,110,.18);
    }

    #slot-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; opacity: .3; color: rgba(255,255,255,.6);
    }
    #slot-placeholder i { font-size: 1.8rem; }
    #slot-placeholder span {
      font-size: .5rem; font-weight: 900;
      letter-spacing: .2em; text-transform: uppercase;
    }

    #slot-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; display: none;
    }

    /* ── Bottom controls ── */
    #bottom-area {
      z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      max-width: 460px; width: 100%; padding: 0 16px;
    }

    #card-info {
      display: flex; align-items: center; gap: 10px;
      height: 26px;
      opacity: 0; transform: translateY(5px);
      transition: opacity .3s, transform .3s;
      pointer-events: none;
    }
    #card-info.on { opacity: 1; transform: none; pointer-events: auto; }
    .rarity-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    #ci-name { font-size: .8rem; font-weight: 700; color: rgba(255,255,255,.82); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #ci-dust { font-size: .6rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: rgba(57,255,110,.88); white-space: nowrap; }

    #burn-btn {
      padding: 13px 44px; border-radius: 14px;
      background: rgba(57,255,110,.07); border: 1.5px solid rgba(57,255,110,.28);
      color: rgba(57,255,110,.9);
      font-family: 'Outfit', sans-serif; font-size: .62rem;
      font-weight: 900; letter-spacing: .22em; text-transform: uppercase;
      cursor: pointer; transition: all .2s;
      opacity: 0; transform: translateY(5px); pointer-events: none;
    }
    #burn-btn.on { opacity: 1; transform: none; pointer-events: auto; }
    #burn-btn:hover { background: rgba(57,255,110,.16); border-color: rgba(57,255,110,.55); box-shadow: 0 0 22px rgba(57,255,110,.22); }
    #burn-btn:active { transform: scale(.97); }
    #burn-btn:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }

    #btn-row { display: flex; gap: 10px; }
    .ghost-btn {
      padding: 7px 18px; border-radius: 9px; background: transparent;
      border: 1px solid rgba(255,255,255,.1); color: rgba(255,255,255,.38);
      font-family: 'Outfit', sans-serif; font-size: .48rem; font-weight: 800;
      letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: all .2s;
    }
    .ghost-btn:hover { border-color: rgba(255,255,255,.22); color: rgba(255,255,255,.65); }
    #change-btn { opacity: 0; pointer-events: none; transition: opacity .3s; }
    #change-btn.on { opacity: 1; pointer-events: auto; }

    #pick-btn {
      padding: 12px 32px; border-radius: 14px;
      background: rgba(255,255,255,.04); border: 1.5px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.48);
      font-family: 'Outfit', sans-serif; font-size: .58rem; font-weight: 900;
      letter-spacing: .18em; text-transform: uppercase; cursor: pointer; transition: all .2s;
    }
    #pick-btn:hover { border-color: rgba(255,255,255,.24); color: rgba(255,255,255,.72); }
    #pick-btn.gone { display: none; }

    /* ── Card picker drawer ── */
    #picker {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: rgba(6,7,11,.97); border-top: 1px solid rgba(255,255,255,.06);
      transform: translateY(100%);
      transition: transform .38s cubic-bezier(.32,.72,0,1);
      max-height: 56vh; display: flex; flex-direction: column;
      backdrop-filter: blur(16px);
    }
    #picker.open { transform: translateY(0); }

    #picker-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px 10px; border-bottom: 1px solid rgba(255,255,255,.05); flex-shrink: 0;
    }
    #picker-title { font-size: .52rem; font-weight: 900; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.36); }
    #picker-close {
      width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.36); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; transition: all .2s;
    }
    #picker-close:hover { color: #fff; }

    #picker-filters {
      display: flex; gap: 6px; padding: 10px 16px 6px;
      overflow-x: auto; flex-shrink: 0; scrollbar-width: none;
    }
    #picker-filters::-webkit-scrollbar { display: none; }
    .filter-pill {
      padding: 5px 14px; border-radius: 99px;
      border: 1px solid rgba(255,255,255,.1); background: transparent;
      color: rgba(255,255,255,.38);
      font-family: 'Outfit', sans-serif; font-size: .46rem; font-weight: 900;
      letter-spacing: .14em; text-transform: uppercase;
      cursor: pointer; transition: all .2s; white-space: nowrap; flex-shrink: 0;
    }
    .filter-pill.active { border-color: rgba(57,255,110,.42); background: rgba(57,255,110,.08); color: rgba(57,255,110,.9); }

    #picker-grid {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 8px 14px 20px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(74px,1fr));
      gap: 7px; align-content: start;
    }
    .picker-card {
      aspect-ratio: 2/3; border-radius: 6px; overflow: hidden;
      cursor: pointer; border: 1.5px solid rgba(255,255,255,.08);
      transition: transform .15s, border-color .15s, box-shadow .15s;
      position: relative; background: rgba(255,255,255,.03);
    }
    .picker-card:hover { transform: translateY(-2px) scale(1.04); border-color: rgba(57,255,110,.3); box-shadow: 0 4px 16px rgba(0,0,0,.5); }
    .picker-card.selected { border-color: rgba(57,255,110,.65); box-shadow: 0 0 18px rgba(57,255,110,.3); }
    .picker-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-rarity-dot { position: absolute; bottom: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; }
    .r-legendary { background: #f59e0b; } .r-epic { background: #8b5cf6; }
    .r-rare { background: #3faaff; } .r-common { background: rgba(255,255,255,.28); }
    .picker-state { grid-column: 1/-1; padding: 40px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .picker-state i { font-size: 1.4rem; opacity: .3; }
    .picker-state p { font-size: .52rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .35; }
    .spin-sm { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,.06); border-top-color: #39ff6e; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Confirm overlay ── */
    #confirm {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(4,4,8,.9); backdrop-filter: blur(12px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 24px;
      opacity: 0; pointer-events: none; transition: opacity .28s;
    }
    #confirm.open { opacity: 1; pointer-events: auto; }
    #confirm-preview { width: 100px; height: 140px; border-radius: 8px; overflow: hidden; border: 1.5px solid rgba(57,255,110,.32); box-shadow: 0 0 28px rgba(57,255,110,.18); }
    #confirm-preview img { width: 100%; height: 100%; object-fit: cover; }
    #confirm h3 { font-size: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: -.01em; margin-top: 4px; }
    #confirm-dust-line { font-size: 1.1rem; font-weight: 900; color: #39ff6e; text-shadow: 0 0 20px rgba(57,255,110,.4); }
    #confirm-sub { font-size: .65rem; color: rgba(255,255,255,.38); max-width: 280px; line-height: 1.6; }
    .confirm-actions { display: flex; gap: 10px; margin-top: 4px; }
    .confirm-actions button { padding: 12px 26px; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: .58rem; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: all .2s; }
    #confirm-yes { background: rgba(57,255,110,.1); border: 1.5px solid rgba(57,255,110,.38); color: #39ff6e; }
    #confirm-yes:hover { background: rgba(57,255,110,.2); box-shadow: 0 0 22px rgba(57,255,110,.3); }
    #confirm-no { background: rgba(255,255,255,.04); border: 1.5px solid rgba(255,255,255,.1); color: rgba(255,255,255,.5); }
    #confirm-no:hover { border-color: rgba(255,255,255,.22); color: rgba(255,255,255,.8); }

    /* ── Sign-in screen ── */
    #signin-screen {
      position: fixed; inset: 0; z-index: 800; background: #07080c;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 24px;
    }
    #signin-screen.hidden { display: none; }
    #signin-screen i { font-size: 2.2rem; opacity: .1; }
    #signin-screen h2 { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; }
    #signin-screen p { font-size: .65rem; color: rgba(255,255,255,.35); max-width: 260px; line-height: 1.7; }
    .signin-link { padding: 14px 36px; border-radius: 12px; background: rgba(57,255,110,.1); border: 1px solid rgba(57,255,110,.3); color: rgba(57,255,110,.9); font-weight: 900; font-size: .65rem; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; transition: all .2s; }
    .signin-link:hover { background: rgba(57,255,110,.2); box-shadow: 0 0 20px rgba(57,255,110,.2); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(70px);
      z-index: 9999; padding: 11px 22px; border-radius: 12px;
      background: rgba(8,10,16,.97); border: 1px solid rgba(255,255,255,.1);
      font-size: .62rem; font-weight: 700; white-space: nowrap;
      transition: transform .32s cubic-bezier(.32,.72,0,1), opacity .32s; opacity: 0;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.success { border-color: rgba(57,255,110,.35); color: #39ff6e; }
    #toast.error   { border-color: rgba(239,68,68,.35);  color: #f87171; }

    /* ── Ring CSS animation keyframes (used by JS) ── */
    @keyframes rcw  { to { transform: rotate(360deg);  } }
    @keyframes rccw { to { transform: rotate(-360deg); } }
  </style>
    <script src="/castle-prefs.js"></script>
</head>
<body>
  <!-- Nav — injected by /streamer-nav.js -->

  <!-- Hidden SVG defs for reusable gradients/filters -->
  <svg width="0" height="0" style="position:absolute;overflow:hidden">
    <defs>
      <!-- Cracked stone filter: jagged broken edges + surface crack veins + grain -->
      <filter id="stone-fx" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB">
        <!-- Displace ring stroke pixels for irregular cracked-stone edges -->
        <feTurbulence type="turbulence" baseFrequency="0.032 0.065" numOctaves="4" seed="17" result="warp"/>
        <feDisplacementMap in="SourceGraphic" in2="warp" scale="10" xChannelSelector="R" yChannelSelector="G" result="jagged"/>
        <!-- Surface crack vein pattern: discrete threshold slices fractal noise into thin dark lines -->
        <feTurbulence type="fractalNoise" baseFrequency="0.46 0.31" numOctaves="5" seed="4" result="crack-raw"/>
        <feComponentTransfer in="crack-raw" result="crack-thresh">
          <feFuncR type="discrete" tableValues="1 1 1 1 1 1 0 1 1 1"/>
          <feFuncG type="discrete" tableValues="1 1 1 1 1 1 0 1 1 1"/>
          <feFuncB type="discrete" tableValues="1 1 1 1 1 1 0 1 1 1"/>
        </feComponentTransfer>
        <feColorMatrix type="saturate" values="0" in="crack-thresh" result="crack-bw"/>
        <!-- Clip crack pattern to displaced stone alpha, then multiply to darken crack lines -->
        <feComposite in="crack-bw" in2="jagged" operator="in" result="cracks"/>
        <feBlend in="jagged" in2="cracks" mode="multiply" result="cracked"/>
        <!-- Subtle stone grain overlay -->
        <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="9" result="grain"/>
        <feColorMatrix type="saturate" values="0" in="grain" result="grain-bw"/>
        <feComposite in="grain-bw" in2="cracked" operator="in" result="grain-clipped"/>
        <feBlend in="cracked" in2="grain-clipped" mode="soft-light"/>
      </filter>

      <!-- Ring stroke gradients — top-down lighting (light source above) -->
      <linearGradient id="sg-outer" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#3c4044"/>
        <stop offset="22%"  stop-color="#2e3236"/>
        <stop offset="50%"  stop-color="#242729"/>
        <stop offset="78%"  stop-color="#1a1d1f"/>
        <stop offset="100%" stop-color="#111416"/>
      </linearGradient>
      <linearGradient id="sg-middle" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#383c40"/>
        <stop offset="25%"  stop-color="#2a2e32"/>
        <stop offset="50%"  stop-color="#202426"/>
        <stop offset="75%"  stop-color="#171a1c"/>
        <stop offset="100%" stop-color="#101315"/>
      </linearGradient>
      <linearGradient id="sg-inner" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#343840"/>
        <stop offset="30%"  stop-color="#262a2e"/>
        <stop offset="55%"  stop-color="#1c2022"/>
        <stop offset="80%"  stop-color="#141819"/>
        <stop offset="100%" stop-color="#0d1012"/>
      </linearGradient>

      <!-- Thin highlight line gradient (light catching the top stone edge) -->
      <linearGradient id="hl-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="rgba(255,255,255,0.28)"/>
        <stop offset="30%"  stop-color="rgba(255,255,255,0.08)"/>
        <stop offset="65%"  stop-color="rgba(255,255,255,0.02)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      </linearGradient>

      <!-- Green glow gradient on rings (ambient, non-rotating) -->
      <radialGradient id="ring-glow-grad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(57,255,110,0)"/>
        <stop offset="80%" stop-color="rgba(57,255,110,0)"/>
        <stop offset="100%" stop-color="rgba(57,255,110,0.06)"/>
      </radialGradient>

      <!-- Card frame inner glow -->
      <radialGradient id="card-bg-grad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#0c0918"/>
        <stop offset="100%" stop-color="#050309"/>
      </radialGradient>

      <!-- Donut clipPaths: annular masks for each ring (fill-rule evenodd = ring band only) -->
      <!-- Outer ring: r 211→275 -->
      <clipPath id="cp-outer">
        <path fill-rule="evenodd" d="
          M 5,280 A 275,275 0 1,0 555,280 A 275,275 0 1,0 5,280 Z
          M 69,280 A 211,211 0 1,0 491,280 A 211,211 0 1,0 69,280 Z
        "/>
      </clipPath>
      <!-- Middle ring: r 145→211 -->
      <clipPath id="cp-middle">
        <path fill-rule="evenodd" d="
          M 69,280 A 211,211 0 1,0 491,280 A 211,211 0 1,0 69,280 Z
          M 135,280 A 145,145 0 1,0 425,280 A 145,145 0 1,0 135,280 Z
        "/>
      </clipPath>
      <!-- Inner ring: r 95→145 -->
      <clipPath id="cp-inner">
        <path fill-rule="evenodd" d="
          M 135,280 A 145,145 0 1,0 425,280 A 145,145 0 1,0 135,280 Z
          M 185,280 A 95,95 0 1,0 375,280 A 95,95 0 1,0 185,280 Z
        "/>
      </clipPath>
    </defs>
  </svg>

  <div id="stars"></div>
  <div id="bg-glow"></div>

  <!-- Sign-in gate -->
  <div id="signin-screen" class="hidden">
    <i class="fa-solid fa-fire-flame-curved"></i>
    <h2>Magic Dust</h2>
    <p>Sign in to burn cards and earn magic dust.</p>
    <a href="/" class="signin-link">Sign In</a>
  </div>

  <!-- Chrome -->
  <div id="dust-chip">
    <i class="fa-solid fa-fire-flame-curved"></i>
    <span id="dust-balance">—</span>
    <span style="opacity:.38;font-size:.44rem;letter-spacing:.1em">DUST</span>
  </div>

  <!-- Main: anvil scene -->
  <div id="main">
    <div id="anvil-scene">

      <!-- Anvil + forge (placeholder shapes; swap for real workshop art later) -->
      <svg id="anvil-svg" viewBox="0 0 470 380" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="steel-top" x1="0" y1="0" x2="0.25" y2="1">
            <stop offset="0" stop-color="#525863"/>
            <stop offset="0.55" stop-color="#3b414a"/>
            <stop offset="1" stop-color="#2c313a"/>
          </linearGradient>
          <linearGradient id="steel-front" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#30353d"/>
            <stop offset="1" stop-color="#1f2329"/>
          </linearGradient>
          <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a3f47"/>
            <stop offset="1" stop-color="#191c21"/>
          </linearGradient>
          <radialGradient id="forge-glow" cx="0.5" cy="0.6" r="0.6">
            <stop offset="0" stop-color="rgba(255,150,30,0.55)"/>
            <stop offset="1" stop-color="rgba(255,120,10,0)"/>
          </radialGradient>
        </defs>

        <!-- ground shadow -->
        <ellipse cx="305" cy="348" rx="120" ry="13" fill="rgba(0,0,0,0.45)"/>

        <!-- ── Forge (top-left) ── -->
        <g id="forge">
          <circle cx="100" cy="120" r="54" fill="url(#forge-glow)"/>
          <path d="M22,166 Q22,52 100,52 Q178,52 178,166 Z" fill="url(#stone)" stroke="#0f1115" stroke-width="2"/>
          <path d="M50,166 Q50,98 100,98 Q150,98 150,166 Z" fill="#0a0a0d"/>
          <!-- logs -->
          <rect x="64" y="148" width="72" height="12" rx="6" fill="#5b3a22" transform="rotate(-7 100 154)"/>
          <rect x="70" y="138" width="62" height="11" rx="5" fill="#6d4727" transform="rotate(8 100 143)"/>
          <!-- flames -->
          <path class="forge-flame"    d="M100,150 C76,128 84,100 100,74 C118,100 124,128 100,150 Z" fill="#ff7a18"/>
          <path class="forge-flame f2" d="M100,150 C86,130 90,108 100,88 C111,108 116,130 100,150 Z" fill="#ffb020"/>
          <path class="forge-flame f3" d="M100,150 C93,134 96,118 100,102 C104,118 108,134 100,150 Z" fill="#ffe27a"/>
        </g>

        <!-- ── Anvil (extruded silhouette: back slab gives depth, front is the
             iconic anvil profile, light top face reads the work surface) ── -->
        <!-- back slab (the thickness seen behind/above) -->
        <polygon fill="#161a1f" points="213,204 268,183.4 285,175.4 413,160 413,186 398,195.8 383,203.6 363,238 385,241.4 385,263.4 308,272.6 308,250.6 331,241.8 313,212 273,206.8"/>
        <!-- front silhouette (horn, face, heel, waist, splayed feet) -->
        <polygon fill="url(#steel-front)" points="170,270 225,249.4 242,241.4 370,226 370,252 355,261.8 340,269.6 320,304 342,307.4 342,329.4 265,338.6 265,316.6 288,307.8 270,278 230,272.8"/>
        <!-- right heel end face -->
        <polygon fill="#1c2027" points="370,226 370,252 413,186 413,160"/>
        <!-- top working face + horn top (the lit surface) -->
        <polygon fill="url(#steel-top)" stroke="#11141a" stroke-width="1"
          points="170,270 225,249.4 242,241.4 370,226 413,160 285,175.4 268,183.4 213,204"/>
        <!-- forged top edge highlight -->
        <polyline fill="none" stroke="#5b626d" stroke-width="1.5" stroke-linejoin="round"
          points="170,270 225,249.4 242,241.4 370,226"/>

        <!-- Card laid flat on the work surface (foreignObject keeps it in-plane) -->
        <foreignObject x="0" y="0" width="100" height="150"
          transform="matrix(0.845,-0.102,-0.1893,0.2907,299.5,184)">
          <div xmlns="http://www.w3.org/1999/xhtml" id="card-slot">
            <div id="slot-placeholder">
              <i class="fa-solid fa-plus"></i>
              <span>Place Card</span>
            </div>
            <img id="slot-img" src="" alt="">
          </div>
        </foreignObject>
      </svg>

    </div>

    <!-- Controls -->
    <div id="bottom-area">
      <div id="card-info">
        <div class="rarity-dot" id="ci-dot"></div>
        <span id="ci-name">—</span>
        <span id="ci-dust">+? Dust</span>
      </div>
      <button id="burn-btn"><i class="fa-solid fa-fire"></i>&nbsp;&nbsp;Burn Card</button>
      <div id="btn-row">
        <button class="ghost-btn" id="change-btn">Change Card</button>
        <button id="pick-btn"><i class="fa-solid fa-layer-group"></i>&nbsp;&nbsp;Select a Card</button>
      </div>
    </div>
  </div>

  <!-- Card picker drawer -->
  <div id="picker">
    <div id="picker-header">
      <span id="picker-title">Choose a Card to Burn</span>
      <button id="picker-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="picker-filters">
      <button class="filter-pill active" data-rarity="all">All</button>
      <button class="filter-pill" data-rarity="legendary">Legendary</button>
      <button class="filter-pill" data-rarity="epic">Epic</button>
      <button class="filter-pill" data-rarity="rare">Rare</button>
      <button class="filter-pill" data-rarity="common">Common</button>
    </div>
    <div id="picker-grid"></div>
  </div>

  <!-- Confirm overlay -->
  <div id="confirm">
    <div id="confirm-preview"><img id="confirm-img" src="" alt=""></div>
    <h3>Burn this card?</h3>
    <div id="confirm-dust-line">+<span id="confirm-amt">?</span> Magic Dust</div>
    <p id="confirm-sub">This card will be permanently destroyed.</p>
    <div class="confirm-actions">
      <button id="confirm-yes"><i class="fa-solid fa-fire"></i>&nbsp;&nbsp;Burn It</button>
      <button id="confirm-no">Cancel</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
  'use strict';

  const BACKEND = (document.querySelector('meta[name="castle-public-url"]')?.content || '').replace(/\/$/, '');

  /* ── State ── */
  let allCards    = [];
  let selectedCard = null;
  let dustBalance  = 0;
  let isBurning    = false;
  let activeRarity = 'all';
  let pickerLoaded = false;
  let csrfToken    = null;

  /* ── Rarity helpers ── */
  const RC = { legendary:'#f59e0b', epic:'#8b5cf6', rare:'#3faaff', common:'rgba(255,255,255,.28)' };
  const RM = { legendary:4, epic:3, rare:2, common:1 };
  const rcls = r => 'r-' + ((r||'common').toLowerCase());
  const rcol = r => RC[(r||'common').toLowerCase()] || RC.common;
  const dust = r => 5 * (RM[(r||'common').toLowerCase()] || 1);
  const esc  = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ────────────────────────────────────────────
     BUILD RUNE SYMBOLS onto ring SVG groups
  ──────────────────────────────────────────── */
  const OUTER_ICONS = [
    'fa-gear','fa-flask','fa-atom','fa-star','fa-eye','fa-gem',
    'fa-fire','fa-bolt','fa-moon','fa-skull',
    'fa-wand-magic-sparkles','fa-screwdriver-wrench',
    'fa-compass','fa-scroll','fa-shield-halved',
    'fa-infinity','fa-sun','fa-snowflake',
  ];
  const MIDDLE_ICONS = [
    'fa-flask-vial','fa-radiation','fa-biohazard',
    'fa-tornado','fa-asterisk','fa-circle-dot',
    'fa-cloud-bolt','fa-fire-flame-curved',
    'fa-hand-sparkles','fa-dragon','fa-otter','fa-crosshairs',
  ];

  function buildSvgRunes(groupId, icons, radius) {
    const ns  = 'http://www.w3.org/2000/svg';
    const grp = document.getElementById(groupId);
    // For FA icons in SVG we use <foreignObject> containing an <i>
    icons.forEach((icon, i) => {
      const angle = (i / icons.length) * 360;
      const rad   = angle * Math.PI / 180;
      const cx    = 280 + radius * Math.sin(rad);
      const cy    = 280 - radius * Math.cos(rad);

      const fo = document.createElementNS(ns, 'foreignObject');
      fo.setAttribute('x', cx - 12);
      fo.setAttribute('y', cy - 12);
      fo.setAttribute('width', '24');
      fo.setAttribute('height', '24');
      // Keep icon upright by counter-rotating around its own center
      fo.setAttribute('transform', `rotate(0,${cx},${cy})`);

      const span = document.createElement('span');
      span.style.cssText = `
        display:flex;align-items:center;justify-content:center;
        width:24px;height:24px;
        color:#39ff6e;
        font-size:11px;
        text-shadow:0 0 6px #39ff6e,0 0 14px rgba(57,255,110,.55),0 0 28px rgba(57,255,110,.25);
      `;
      const ico = document.createElement('i');
      ico.className = `fa-solid ${icon}`;
      span.appendChild(ico);
      fo.appendChild(span);
      grp.appendChild(fo);
    });
  }

  // Sigils intentionally disabled for now.

  /* ────────────────────────────────────────────
     SCENE HOOKS (portal removed — anvil scene sizes via CSS)
     idleSpin/fastSpin/stopSpin/setGlow kept as no-ops so existing
     callers in selectCard/clearCard/executeBurn stay valid.
  ──────────────────────────────────────────── */
  function idleSpin() {}
  function fastSpin() {}
  function stopSpin() {}
  function setGlow() {}

  /* ────────────────────────────────────────────
     CARD SELECTION
  ──────────────────────────────────────────── */
  function selectCard(card) {
    selectedCard = card;
    const img = document.getElementById('slot-img');
    const ph  = document.getElementById('slot-placeholder');
    const slot = document.getElementById('card-slot');
    img.src = card.image_url || '';
    img.style.display = 'block';
    ph.style.display  = 'none';
    slot.classList.add('has-card');
    document.getElementById('ci-dot').style.background = rcol(card.rarity);
    document.getElementById('ci-name').textContent = card.name || 'Unknown';
    document.getElementById('ci-dust').textContent = `+${dust(card.rarity)} Dust`;
    document.getElementById('card-info').classList.add('on');
    document.getElementById('burn-btn').classList.add('on');
    document.getElementById('change-btn').classList.add('on');
    document.getElementById('pick-btn').classList.add('gone');
    document.body.classList.add('has-card');
    setGlow(.35);
    idleSpin();
    closePicker();
  }

  function clearCard() {
    selectedCard = null;
    const img  = document.getElementById('slot-img');
    const ph   = document.getElementById('slot-placeholder');
    const slot = document.getElementById('card-slot');
    img.style.display = 'none'; img.src = ''; img.style.opacity = '';
    ph.style.display  = '';
    slot.classList.remove('has-card');
    document.getElementById('card-info').classList.remove('on');
    document.getElementById('burn-btn').classList.remove('on');
    document.getElementById('change-btn').classList.remove('on');
    document.getElementById('pick-btn').classList.remove('gone');
    document.body.classList.remove('has-card');
    setGlow(0);
    stopSpin();
  }

  /* ────────────────────────────────────────────
     CARD PICKER
  ──────────────────────────────────────────── */
  function openPicker()  { document.getElementById('picker').classList.add('open'); if (!pickerLoaded) loadCards(); }
  function closePicker() { document.getElementById('picker').classList.remove('open'); }

  async function loadCards() {
    pickerLoaded = true;
    const grid = document.getElementById('picker-grid');
    grid.innerHTML = '<div class="picker-state"><div class="spin-sm"></div></div>';
    try {
      const res = await fetch(`${BACKEND}/api/collection?streamer=all`, { credentials: 'include' });
      if (res.status === 401) { showSignIn(); closePicker(); return; }
      if (!res.ok) throw new Error('Failed');
      allCards = await res.json();
      renderPicker();
    } catch (e) {
      grid.innerHTML = '<div class="picker-state"><i class="fa-solid fa-triangle-exclamation"></i><p>Failed to load cards</p></div>';
    }
  }

  function renderPicker() {
    const filtered = activeRarity === 'all'
      ? allCards
      : allCards.filter(c => (c.rarity||'').toLowerCase() === activeRarity);
    const grid = document.getElementById('picker-grid');
    if (!filtered.length) {
      const lbl = activeRarity === 'all' ? 'cards' : `${activeRarity} cards`;
      grid.innerHTML = `<div class="picker-state"><i class="fa-solid fa-ghost"></i><p>No ${lbl}</p></div>`;
      return;
    }
    grid.innerHTML = '';
    filtered.forEach(card => {
      const div = document.createElement('div');
      div.className = 'picker-card' + (selectedCard?.user_card_id === card.user_card_id ? ' selected' : '');
      div.innerHTML = `
        ${card.image_url ? `<img src="${esc(card.image_url)}" alt="${esc(card.name)}" loading="lazy">` : '<div style="width:100%;height:100%;background:linear-gradient(135deg,#0d0f14,#161820)"></div>'}
        <div class="card-rarity-dot ${rcls(card.rarity)}"></div>`;
      div.addEventListener('click', () => selectCard(card));
      grid.appendChild(div);
    });
  }

  /* ────────────────────────────────────────────
     BURN FLOW
  ──────────────────────────────────────────── */
  function showConfirm() {
    if (!selectedCard || isBurning) return;
    document.getElementById('confirm-img').src = selectedCard.image_url || '';
    document.getElementById('confirm-amt').textContent = dust(selectedCard.rarity);
    document.getElementById('confirm-sub').textContent = `"${selectedCard.name}" will be permanently destroyed.`;
    document.getElementById('confirm').classList.add('open');
  }

  async function executeBurn() {
    if (!selectedCard || isBurning) return;
    isBurning = true;
    document.getElementById('confirm').classList.remove('open');
    document.getElementById('burn-btn').disabled = true;

    const cardToRemove = selectedCard;
    const slotImg = document.getElementById('slot-img');
    const chip    = document.getElementById('dust-chip');

    // Kick off the anvil smash IMMEDIATELY (using the locally-known reward) and run
    // the network call in parallel — otherwise the card sits frozen for the whole
    // round-trip before the hammer falls, which is the "delay/jank" people saw.
    // Real anvil/workshop art TODO — hook points live in /anvil-smash.js.
    if (typeof window.playAnvilSmash === 'function' && slotImg) {
      window.playAnvilSmash({
        cardEl: slotImg,
        imageUrl: cardToRemove.image_url || slotImg.src,
        amount: dust(cardToRemove.rarity),
        target: chip,
      });
    }
    chip.classList.add('glow');

    try {
      const headers = { 'Content-Type': 'application/json' };
      if (csrfToken) headers['X-CSRF-Token'] = csrfToken;

      const res  = await fetch(`${BACKEND}/api/dust/burn-card`, {
        method: 'POST', credentials: 'include',
        headers, body: JSON.stringify({ user_card_id: cardToRemove.user_card_id }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

      // Reconcile the real balance once the server confirms.
      dustBalance = data.magic_dust;
      document.getElementById('dust-balance').textContent = dustBalance.toLocaleString();

      // Let the hammer strike + shards burst before clearing the slot.
      await sleep(900);
      clearCard();
      allCards = allCards.filter(c => c.user_card_id !== cardToRemove.user_card_id);
      if (pickerLoaded) renderPicker();

      await sleep(900);
      chip.classList.remove('glow');

    } catch (e) {
      // Burn failed server-side — undo the optimistic visuals.
      chip.classList.remove('glow');
      if (slotImg) slotImg.style.opacity = '';
      if (selectedCard) { idleSpin(); setGlow(.35); } else { stopSpin(); setGlow(0); }
      showToast(e.message || 'Burn failed', 'error');
    }

    isBurning = false;
    document.getElementById('burn-btn').disabled = false;
  }

  /* ────────────────────────────────────────────
     AUTH + INIT
  ──────────────────────────────────────────── */
  function showSignIn() { document.getElementById('signin-screen').classList.remove('hidden'); }

  function setupNavUser(user) {
    if (!user) return;
    window.currentUser = { ...user, avatar: user.avatar_url || user.avatar };
    const navAvatar  = document.getElementById('nav-avatar');
    const menuAvatar = document.getElementById('nav-user-menu-avatar');
    if (navAvatar)  navAvatar.src  = window.currentUser.avatar || '';
    if (menuAvatar) menuAvatar.src = window.currentUser.avatar || '';
    const preview = document.getElementById('nav-user-preview');
    if (preview) { preview.classList.remove('hidden'); preview.style.display = 'flex'; }
    window.initNavUserMenu?.();
    window.updateNavUserMenuLabels?.();
  }

  (async function init() {
    // Fetch CSRF token for POST requests
    try {
      const cr = await fetch(`${BACKEND}/api/csrf`, { credentials: 'include' });
      if (cr.ok) { const cd = await cr.json(); csrfToken = cd.token || null; }
    } catch (e) { console.warn('[MagicDust] csrf fetch failed', e); }

    // Session for nav user menu
    try {
      const sr = await fetch(`${BACKEND}/api/auth/session`, { credentials: 'include' });
      if (sr.ok) {
        const sess = await sr.json().catch(() => null);
        if (sess && sess.user) setupNavUser(sess.user);
      }
    } catch (e) { console.warn('[MagicDust] session fetch failed', e); }

    // Dust balance (also validates session)
    try {
      const res = await fetch(`${BACKEND}/api/dust/balance`, { credentials: 'include' });
      if (res.status === 401) { showSignIn(); return; }
      if (res.ok) {
        const d = await res.json();
        dustBalance = d.magic_dust ?? 0;
        document.getElementById('dust-balance').textContent = dustBalance.toLocaleString();
      }
    } catch (e) { console.warn('[MagicDust] balance fetch failed', e); }
  })();

  /* ────────────────────────────────────────────
     UTILITIES
  ──────────────────────────────────────────── */
  let toastTimer;
  function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3400);
  }

  /* ────────────────────────────────────────────
     EVENT LISTENERS
  ──────────────────────────────────────────── */
  document.getElementById('pick-btn').addEventListener('click', openPicker);
  document.getElementById('change-btn').addEventListener('click', openPicker);
  document.getElementById('picker-close').addEventListener('click', closePicker);
  document.getElementById('card-slot').addEventListener('click', () => { if (!selectedCard) openPicker(); });
  document.getElementById('burn-btn').addEventListener('click', showConfirm);
  document.getElementById('confirm-yes').addEventListener('click', executeBurn);
  document.getElementById('confirm-no').addEventListener('click', () => document.getElementById('confirm').classList.remove('open'));

  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeRarity = btn.dataset.rarity;
      if (pickerLoaded) renderPicker();
    });
  });

  document.addEventListener('click', e => {
    const picker    = document.getElementById('picker');
    const pickBtn   = document.getElementById('pick-btn');
    const changeBtn = document.getElementById('change-btn');
    if (
      picker.classList.contains('open') &&
      !picker.contains(e.target) &&
      !pickBtn.contains(e.target) &&
      !changeBtn.contains(e.target)
    ) closePicker();
  });
  </script>
<script src="/anvil-smash.js"></script>
<script src="/nav-user-menu.js"></script>
<script src="/nav-notifications.js"></script>
<script src="/streamer-nav.js"></script>
