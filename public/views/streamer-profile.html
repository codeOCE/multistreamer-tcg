
<section id="streamer-profile-view"
    class="hidden min-h-screen pt-32 px-6 lg:px-12 pb-32 max-w-[1500px] mx-auto void-fade space-y-12">
    <div class="flex items-center gap-8 border-b border-white/10 flex-col md:flex-row pb-12">
        <img id="sp-avatar" src=""
            class="w-32 h-32 md:w-48 md:h-48 rounded-[2rem] border-2 border-void-accent/40 bg-void-bg p-2 shadow-[0_0_40px_rgba(var(--void-accent-rgb),0.3)] object-cover">
        <div class="space-y-4 text-center md:text-left">
            <h2 id="sp-name"
                class="text-5xl md:text-7xl font-display font-black text-void-text uppercase tracking-tighter italic"
                style="text-shadow: 0 4px 20px rgba(0,0,0,0.5);">---</h2>
            <div
                class="flex items-center justify-center md:justify-start gap-4 text-sm font-bold uppercase tracking-widest text-void-muted">
                <span id="sp-live-badge"
                    class="hidden items-center gap-2 text-void-accent bg-void-accent/10 px-3 py-1.5 rounded-full border border-void-accent/20 shadow-lg"><span
                        class="w-2 h-2 rounded-full bg-void-accent animate-pulse"></span>LIVE NOW</span>
                <span class="bg-white/5 px-3 py-1.5 rounded-full border border-white/10">Protocol
                    Activated</span>
            </div>
        </div>
    </div>

    <div id="sp-social-links" class="flex flex-wrap justify-center md:justify-start gap-3">
        
    </div>

    <div class="grid grid-cols-1 gap-8 max-w-4xl mx-auto md:mx-0">
        <div class="glass-panel p-10 rounded-3xl border border-white/5 bg-white/[0.02]">
            <h3 class="text-2xl font-black uppercase tracking-widest text-void-text mb-4">Channel Core</h3>
            <p class="text-void-muted leading-relaxed mb-8">Access the creator's specialized asset repository,
                collect drops, and build your specialized binder.</p>
            <button id="sp-enter-dashboard-btn" class="w-full saas-button rounded-2xl py-5 text-sm">Enter
                Dashboard <i class="fa-solid fa-arrow-right ml-2 opacity-50"></i></button>
        </div>
    </div>
</section>
