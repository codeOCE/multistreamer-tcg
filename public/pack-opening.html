<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="castle-public-url" content="https://multistreamer-tcg.codeoce.workers.dev">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Open Pack · Castle TCG</title>
  <link rel="icon" type="image/png" href="https://cdn.codeoce.com/logo/logo_white.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07080d;
      color: #e8eaf0;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Ambient glow ── */
    #bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 50% 60%, rgba(99,102,241,.14) 0%, transparent 70%);
      transition: background 1.4s ease;
    }

    /* ── Particle canvas ── */
    #fx-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    /* ── Flash ── */
    #flash {
      position: fixed; inset: 0; z-index: 999; pointer-events: none;
      background: #fff; opacity: 0; transition: opacity .06s;
    }

    /* ── Back btn ── */
    #back-btn {
      position: fixed; top: 18px; left: 18px; z-index: 600;
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.4); font-size: .85rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    #back-btn:hover { color: #fff; border-color: rgba(255,255,255,.22); }

    /* ── Pack counter chip ── */
    #pack-chip {
      position: fixed; top: 18px; right: 18px; z-index: 600;
      padding: 6px 14px; border-radius: 99px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
      font-size: .5rem; font-weight: 800; letter-spacing: .18em;
      text-transform: uppercase; color: rgba(255,255,255,.3);
      display: none;
    }

    /* ════════════════════════════════════════
       SCREENS
    ════════════════════════════════════════ */
    .screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      transition: opacity .35s ease, transform .35s ease;
    }
    .screen.out { opacity: 0; pointer-events: none; transform: scale(.97); }

    /* ── Loading ── */
    #s-loading p {
      margin-top: 14px; font-size: .55rem; font-weight: 800;
      letter-spacing: .24em; text-transform: uppercase; color: rgba(255,255,255,.22);
    }
    .spin {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.07);
      border-top-color: #6366f1;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty ── */
    #s-empty { text-align: center; gap: 16px; }
    #s-empty .ico { font-size: 2.8rem; opacity: .07; }
    #s-empty h2 { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; }
    #s-empty p { font-size: .65rem; color: rgba(255,255,255,.35); max-width: 280px; line-height: 1.7; }
    .empty-cta {
      margin-top: 12px; text-decoration: none; display: inline-block;
      padding: 14px 36px; border-radius: 12px; background: #6366f1;
      color: #fff; font-weight: 900; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
    }

    /* ══════════════════════════════════════
       LOBBY
    ══════════════════════════════════════ */
    #s-lobby { gap: 32px; }
    .lobby-sub {
      font-size: .5rem; font-weight: 800; letter-spacing: .28em;
      text-transform: uppercase; color: rgba(255,255,255,.25); text-align: center;
    }
    .lobby-title {
      font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 900;
      text-transform: uppercase; letter-spacing: -.04em; line-height: 1; text-align: center;
    }
    .lobby-title span { color: #6366f1; }

    /* 3D floating pack — perspective lives on the parent */
    #lobby-perspective {
      perspective: 800px; perspective-origin: 50% 50%;
      width: min(180px, 42vw); height: min(300px, 70vw);
    }
    #lobby-pack-wrap {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      animation: packFloat 5s ease-in-out infinite;
      filter:
        drop-shadow(0 40px 50px rgba(0,0,0,.9))
        drop-shadow(0 0 40px rgba(99,102,241,.35));
    }
    #lobby-pack-wrap img {
      width: 100%; height: 100%; object-fit: contain;
      border-radius: 12px; display: block;
    }
    @keyframes packFloat {
      0%   { transform: rotateX(10deg) rotateY(-8deg) translateY(0px); }
      30%  { transform: rotateX(-4deg) rotateY(11deg) translateY(-16px); }
      65%  { transform: rotateX(7deg)  rotateY(-10deg) translateY(-9px); }
      100% { transform: rotateX(10deg) rotateY(-8deg) translateY(0px); }
    }

    /* ── Holographic foil — very subtle tint, pack art stays visible ── */
    .pack-foil {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 2;
      background: linear-gradient(
        var(--foil-angle, 130deg),
        hsla(320,80%,60%,.35) 0%,  hsla(30,80%,60%,.28) 20%,
        hsla(60,80%,55%,.28)  40%, hsla(150,80%,50%,.28) 55%,
        hsla(210,80%,65%,.35) 70%, hsla(270,80%,65%,.35) 85%,
        hsla(320,80%,60%,.35) 100%
      );
      mix-blend-mode: soft-light;
      opacity: .6;
      transition: opacity .3s;
    }
    /* Single thin specular sweep — subtle, not a full rainbow wash */
    .pack-shimmer {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 3;
      background: linear-gradient(
        calc(var(--foil-angle, 130deg) + 20deg),
        transparent 0%, transparent 42%,
        rgba(255,255,255,.15) 49%,
        rgba(255,255,255,.15) 51%,
        transparent 58%
      );
      background-size: 200% 200%;
      animation: shimmerSweep 3.5s ease-in-out infinite alternate;
    }
    @keyframes shimmerSweep {
      0%   { background-position: 120% 120%; }
      100% { background-position: -120% -120%; }
    }
    /* Specular highlight — follows mouse */
    .pack-shine {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 4;
      background: radial-gradient(
        ellipse 55% 40% at var(--shine-x, 30%) var(--shine-y, 22%),
        rgba(255,255,255,.32) 0%, rgba(255,255,255,.06) 50%, transparent 70%
      );
    }
    /* Rim light — physical edge depth */
    .pack-rim {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 5;
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.22),
        inset -1px -2px 0 rgba(0,0,0,.55),
        inset 0 0 30px rgba(0,0,0,.18);
    }

    .lobby-btn {
      padding: 16px 48px; border-radius: 14px; border: none;
      background: #6366f1; color: #fff; font-family: 'Outfit', sans-serif;
      font-size: .95rem; font-weight: 900; letter-spacing: .06em;
      text-transform: uppercase; cursor: pointer;
      box-shadow: 0 8px 32px rgba(99,102,241,.4);
      transition: transform .15s, box-shadow .15s;
    }
    .lobby-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 42px rgba(99,102,241,.55); }
    .lobby-btn:active { transform: scale(.97); }

    /* ══════════════════════════════════════
       TRACE / OPEN STAGE
    ══════════════════════════════════════ */
    #s-open { background: transparent; gap: 0; }

    #open-stage {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      perspective: 900px;
      perspective-origin: 50% 42%;
    }

    /* 3D scene — JS drives the tilt via style.transform */
    #pack-scene {
      transform-style: preserve-3d;
      transition: transform .08s ease;
      animation: packDrift 5s ease-in-out infinite;
    }
    @keyframes packDrift {
      0%   { transform: rotateX(10deg) rotateY(-8deg); }
      35%  { transform: rotateX(-3deg) rotateY(10deg); }
      70%  { transform: rotateX(7deg)  rotateY(-10deg); }
      100% { transform: rotateX(10deg) rotateY(-8deg); }
    }
    /* Freeze animation while user is actively tracing */
    #pack-scene.tracing { animation-play-state: paused; }

    #pack-wrap {
      position: relative;
      width: min(220px, 46vw);
      height: min(366px, 77vw);
      cursor: crosshair;
      touch-action: none;
      transform-style: preserve-3d;
      filter:
        drop-shadow(0 50px 70px rgba(0,0,0,.9))
        drop-shadow(0 0 50px rgba(99,102,241,.35))
        drop-shadow(0 0 12px rgba(150,100,255,.3));
    }

    /* split halves — background-image set by JS */
    .pack-half {
      position: absolute; left: 0; width: 100%;
      overflow: hidden;
      background-repeat: no-repeat;
    }
    #pack-top { top: 0;    height: 12%; border-radius: 12px 12px 0 0;
      transition: transform .75s cubic-bezier(.2,0,.4,1), opacity .6s ease; }
    #pack-bot { bottom: 0; height: 88%; border-radius: 0 0 12px 12px;
      transition: transform .6s cubic-bezier(.4,0,.2,1), opacity .6s ease; }

    /* Foil on open pack — subtle soft-light, pack art stays hero */
    #open-pack-foil {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 4;
      background: linear-gradient(
        var(--foil-angle, 125deg),
        hsla(320,80%,60%,.35) 0%,  hsla(30,80%,60%,.28) 20%,
        hsla(60,80%,55%,.28)  40%, hsla(150,80%,50%,.28) 55%,
        hsla(210,80%,65%,.35) 70%, hsla(270,80%,65%,.35) 85%,
        hsla(320,80%,60%,.35) 100%
      );
      mix-blend-mode: soft-light;
      opacity: .65;
    }
    /* Thin specular sweep */
    #open-pack-shimmer {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 5;
      background: linear-gradient(
        calc(var(--foil-angle, 125deg) + 20deg),
        transparent 0%, transparent 42%,
        rgba(255,255,255,.18) 49%,
        rgba(255,255,255,.18) 51%,
        transparent 58%
      );
      background-size: 200% 200%;
      animation: shimmerSweep 3s ease-in-out infinite alternate;
    }
    /* Specular highlight follows mouse */
    #open-pack-shine {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 6;
      background: radial-gradient(
        ellipse 55% 40% at var(--shine-x, 35%) var(--shine-y, 25%),
        rgba(255,255,255,.35) 0%, rgba(255,255,255,.05) 50%, transparent 70%
      );
    }
    /* Ambient cut-line glow — always visible, pulses to invite interaction */
    #trace-line {
      position: absolute; left: -4px; right: -4px; top: 12%;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%, rgba(0,212,255,.7) 15%,
        #00eeff 50%, rgba(0,212,255,.7) 85%, transparent 100%
      );
      box-shadow: 0 0 12px 3px rgba(0,212,255,.6), 0 0 30px 8px rgba(0,212,255,.25);
      pointer-events: none; z-index: 8;
      animation: cutLinePulse 2s ease-in-out infinite;
    }
    @keyframes cutLinePulse {
      0%,100% { opacity: .55; box-shadow: 0 0 10px 3px rgba(0,212,255,.55), 0 0 28px 8px rgba(0,212,255,.2); }
      50%     { opacity: 1;   box-shadow: 0 0 18px 6px rgba(0,212,255,.9),  0 0 50px 16px rgba(0,212,255,.4); }
    }

    /* Electric glow fill — grows from touch point */
    #trace-fill {
      position: absolute; top: 12%;
      height: 3px; width: 0px; left: 0;
      background: linear-gradient(90deg, transparent, #00d4ff 10%, #fff 50%, #00d4ff 90%, transparent);
      box-shadow: 0 0 20px 6px rgba(0,212,255,1), 0 0 55px 18px rgba(0,212,255,.55);
      pointer-events: none; z-index: 9;
    }

    /* Hint */
    #trace-hint {
      position: absolute; bottom: -54px; left: 50%;
      transform: translateX(-50%);
      font-size: .52rem; font-weight: 800; letter-spacing: .22em;
      text-transform: uppercase; color: rgba(255,255,255,.32); white-space: nowrap;
      animation: pulseHint 2s ease-in-out infinite;
    }
    @keyframes pulseHint { 0%,100%{opacity:.28} 50%{opacity:1} }

    /* Slice physics — top flies off, bot drops */
    @keyframes topFlyOff {
      0%   { transform: translateY(0)    rotate(0deg)   translateX(0); opacity: 1; }
      15%  { transform: translateY(-18px) rotate(-5deg)  translateX(8px); opacity: 1; }
      100% { transform: translateY(-200%) rotate(-28deg) translateX(70px); opacity: 0; }
    }
    #pack-wrap.sliced #pack-top  { animation: topFlyOff .9s cubic-bezier(.3,0,.5,1) forwards; }
    #pack-wrap.sliced #pack-bot  { transform: translateY(36px) scaleY(.97); opacity: 0; }
    #pack-wrap.sliced #trace-hint     { opacity: 0; pointer-events: none; }
    #pack-wrap.sliced #trace-scissors { display: none; }
    #pack-wrap.sliced #trace-fill     { opacity: 0; }
    #pack-wrap.sliced #trace-line     { opacity: 0; }

    /* ══════════════════════════════════════
       REVEAL SCREEN (one card at a time)
    ══════════════════════════════════════ */
    #s-reveal {
      gap: 20px;
      background: transparent;
    }

    /* Card stage — extra bottom padding shows stack peeking */
    #rev-stage {
      position: relative;
      width: min(260px, 70vw);
      height: min(364px, 98vw);
      flex-shrink: 0;
      perspective: 900px;
      overflow: visible;
      margin-bottom: 30px;
    }

    .rev-card {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      transition: transform .38s cubic-bezier(.4,0,.2,1), opacity .38s ease;
      cursor: grab;
    }
    .rev-card:active { cursor: grabbing; }

    /* Tilt wrapper — separate from flip so they never fight */
    .rev-tilt {
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .08s ease;
    }

    .rev-inner {
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .6s cubic-bezier(.16,1,.3,1);
      border-radius: 14px;
    }
    .rev-card.flipped .rev-inner { transform: rotateY(180deg); }

    .rev-back, .rev-face {
      position: absolute; inset: 0;
      border-radius: 14px;
      backface-visibility: hidden; overflow: hidden;
    }
    .rev-back {
      background: linear-gradient(135deg, #1b1d2e 0%, #0d0f19 100%);
      border: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 32px 80px rgba(0,0,0,.75);
    }
    .back-logo { width: 50px; opacity: .1; }

    .rev-face {
      transform: rotateY(180deg);
      background: #0d0f14;
      box-shadow: 0 32px 80px rgba(0,0,0,.75);
    }
    .rev-face > img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 14px; }

    /* Holographic foil on face */
    .rev-holo {
      position: absolute; inset: 0; border-radius: 14px;
      pointer-events: none;
      background: linear-gradient(
        var(--holo-angle, 135deg),
        rgba(255,0,128,.22) 0%, rgba(255,128,0,.18) 16%,
        rgba(255,255,0,.18) 33%, rgba(0,255,128,.18) 50%,
        rgba(0,128,255,.18) 66%, rgba(128,0,255,.22) 83%,
        rgba(255,0,128,.22) 100%
      );
      mix-blend-mode: color-dodge;
      opacity: 0; transition: opacity .5s ease .3s;
    }
    .rev-card.flipped .rev-holo { opacity: var(--holo-opacity, 0); }

    /* Shine sweep */
    .rev-shine {
      position: absolute; inset: 0; border-radius: 14px;
      pointer-events: none;
      background: radial-gradient(
        ellipse 55% 38% at var(--mx, 50%) var(--my, 50%),
        rgba(255,255,255,.16) 0%, transparent 70%
      );
    }

    /* Rarity glow ring */
    .rev-face::after {
      content: ''; position: absolute; inset: 0; border-radius: 14px;
      pointer-events: none; opacity: 0; transition: opacity .5s ease .5s;
    }
    .rev-card.flipped .rev-face::after { opacity: 1; }
    .rev-card[data-r="Uncommon"] .rev-face::after  { box-shadow: inset 0 0 0 2px rgba(96,165,250,.6),  0 0 28px rgba(96,165,250,.4); }
    .rev-card[data-r="Rare"] .rev-face::after       { box-shadow: inset 0 0 0 2px rgba(250,204,21,.8),  0 0 36px rgba(250,204,21,.5); }
    .rev-card[data-r="Epic"] .rev-face::after       { box-shadow: inset 0 0 0 2px rgba(139,92,246,.9),  0 0 40px rgba(139,92,246,.55); }
    .rev-card[data-r="Legendary"] .rev-face::after,
    .rev-card[data-r="Secret"] .rev-face::after     { box-shadow: inset 0 0 0 2px rgba(217,70,239,.95), 0 0 52px rgba(217,70,239,.65), 0 0 90px rgba(217,70,239,.3); }

    /* Rarity pip on face */
    .rev-pip {
      position: absolute; bottom: 9px; left: 50%;
      transform: translateX(-50%);
      font-size: .4rem; font-weight: 900; letter-spacing: .1em;
      text-transform: uppercase; padding: 2px 9px; border-radius: 4px;
      white-space: nowrap; z-index: 2;
      opacity: 0; transition: opacity .3s ease .7s;
    }
    .rev-card.flipped .rev-pip { opacity: 1; }
    .rp-common    { background: rgba(255,255,255,.1); color: rgba(255,255,255,.55); }
    .rp-uncommon  { background: rgba(96,165,250,.18); color: #93c5fd; }
    .rp-rare      { background: rgba(250,204,21,.18); color: #fde047; }
    .rp-epic      { background: rgba(139,92,246,.2);  color: #c4b5fd; }
    .rp-legendary,
    .rp-secret    { background: rgba(217,70,239,.2);  color: #f0abfc; }

    /* Dot counter */
    #rev-dots {
      display: flex; gap: 7px; align-items: center;
    }
    .rdot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,.18);
      transition: all .35s cubic-bezier(.16,1,.3,1);
    }
    .rdot.active { width: 22px; border-radius: 3px; background: #6366f1; }
    .rdot.seen   { background: rgba(99,102,241,.45); }

    /* Card info (name + rarity, appears after flip) */
    #rev-info {
      text-align: center;
      opacity: 0; transform: translateY(8px);
      transition: opacity .3s ease .65s, transform .3s ease .65s;
      min-height: 42px;
    }
    #rev-info.show { opacity: 1; transform: none; }
    #rev-card-name { font-size: 1rem; font-weight: 900; letter-spacing: -.02em; }
    #rev-card-rarity { font-size: .5rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; opacity: .4; margin-top: 3px; }

    /* Next / Results button */
    #rev-next-btn {
      padding: 13px 36px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.55); font-family: 'Outfit', sans-serif;
      font-size: .65rem; font-weight: 900; letter-spacing: .12em;
      text-transform: uppercase; cursor: pointer;
      opacity: 0; transform: translateY(8px);
      transition: opacity .3s ease .9s, transform .3s ease .9s, background .2s, border-color .2s, color .2s, box-shadow .2s;
    }
    #rev-next-btn.show { opacity: 1; transform: none; }
    #rev-next-btn:hover { border-color: rgba(255,255,255,.25); color: #fff; }
    #rev-next-btn.final {
      background: #6366f1; color: #fff; border-color: transparent;
      box-shadow: 0 6px 24px rgba(99,102,241,.45);
    }
    #rev-next-btn.final:hover { box-shadow: 0 8px 32px rgba(99,102,241,.6); transform: translateY(-2px); }

    /* Swipe hint */
    #rev-swipe-hint {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      font-size: .5rem; font-weight: 800; letter-spacing: .2em;
      text-transform: uppercase; color: rgba(255,255,255,.22);
      white-space: nowrap; pointer-events: none; z-index: 20;
      animation: pulseHint 2.5s ease-in-out infinite;
    }
    #rev-swipe-hint.hide { display: none; }

    /* ══════════════════════════════════════
       RESULTS
    ══════════════════════════════════════ */
    #s-results {
      gap: 22px; overflow-y: auto; justify-content: flex-start;
      padding: 70px 16px 48px;
    }
    .res-title {
      font-size: clamp(1.1rem, 4vw, 1.9rem); font-weight: 900;
      text-transform: uppercase; letter-spacing: -.03em; text-align: center;
    }
    .res-title span { color: #6366f1; }
    .res-grid {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; max-width: 680px;
    }
    .res-card {
      width: 96px; display: flex; flex-direction: column; gap: 5px;
      animation: fadeUp .4s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    .res-card img {
      width: 96px; height: 134px; object-fit: cover;
      border-radius: 8px; border: 1px solid rgba(255,255,255,.07);
    }
    .res-name {
      font-size: .5rem; font-weight: 700; color: rgba(255,255,255,.7);
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .res-rar {
      font-size: .42rem; font-weight: 900; letter-spacing: .1em;
      text-transform: uppercase; text-align: center;
    }
    .rc-common   { color: rgba(255,255,255,.38); }
    .rc-uncommon { color: #93c5fd; }
    .rc-rare     { color: #fde047; }
    .rc-epic     { color: #c4b5fd; }
    .rc-legendary, .rc-secret { color: #f0abfc; }

    .res-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn-ghost {
      padding: 11px 24px; border-radius: 11px;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.6); font-family: 'Outfit', sans-serif;
      font-size: .65rem; font-weight: 900; letter-spacing: .1em;
      text-transform: uppercase; cursor: pointer; transition: all .2s;
    }
    .btn-ghost:hover { border-color: rgba(255,255,255,.22); color: #fff; }
    .btn-primary {
      padding: 11px 32px; border-radius: 11px; border: none;
      background: #6366f1; color: #fff; font-family: 'Outfit', sans-serif;
      font-size: .65rem; font-weight: 900; letter-spacing: .1em;
      text-transform: uppercase; cursor: pointer;
      box-shadow: 0 4px 20px rgba(99,102,241,.4); transition: all .2s;
    }
    .btn-primary:hover { box-shadow: 0 8px 32px rgba(99,102,241,.55); transform: translateY(-1px); }

    @media (max-width: 420px) {
      #rev-stage { width: min(230px, 80vw); height: min(322px, 112vw); }
    }
  </style>
</head>
<body>
  <div id="bg-glow"></div>
  <canvas id="fx-canvas"></canvas>
  <div id="flash"></div>

  <button id="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
  <div id="pack-chip"></div>

  <!-- Loading -->
  <div class="screen" id="s-loading">
    <div class="spin"></div>
    <p>Loading…</p>
  </div>

  <!-- Empty -->
  <div class="screen out" id="s-empty">
    <div class="ico"><i class="fa-solid fa-box-open"></i></div>
    <h2>No packs to open</h2>
    <p>Purchase a pack from a creator's page or earn one through channel points, subs, or bits.</p>
    <a class="empty-cta" href="/my-collection.html">View Collection</a>
  </div>

  <!-- Lobby -->
  <div class="screen out" id="s-lobby">
    <p class="lobby-sub">Castle TCG</p>
    <h1 class="lobby-title">Open Your <span>Pack</span></h1>
    <div id="lobby-perspective">
    <div id="lobby-pack-wrap">
      <img id="lobby-img" src="https://cdn.codeoce.com/branding/default-pack.png" alt="Pack">
    </div>
    </div>
    <button class="lobby-btn" onclick="beginOpen()">
      <i class="fa-solid fa-bolt" style="margin-right:8px"></i>Open Pack
    </button>
  </div>

  <!-- Trace / slice stage -->
  <div class="screen out" id="s-open">
    <div id="open-stage">
      <div id="pack-scene">
        <div id="pack-wrap">
          <div class="pack-half" id="pack-top"></div>
          <div class="pack-half" id="pack-bot"></div>
          <div id="trace-line"></div>
          <div id="trace-fill"></div>
          <div id="trace-hint">Slide to cut open</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Reveal (one card at a time) -->
  <div class="screen out" id="s-reveal">
    <div id="rev-stage"><!-- card injected by JS --></div>
    <div id="rev-dots"><!-- dots injected by JS --></div>
    <div id="rev-info">
      <div id="rev-card-name"></div>
      <div id="rev-card-rarity"></div>
    </div>
    <button id="rev-next-btn" onclick="nextCard()">Next card &rsaquo;</button>
  </div>
  <div id="rev-swipe-hint">Swipe left to continue</div>

  <!-- Results -->
  <div class="screen out" id="s-results">
    <h2 class="res-title">You got <span id="res-count">0</span> cards!</h2>
    <div class="res-grid" id="res-grid"></div>
    <div class="res-actions">
      <button class="btn-ghost" id="next-btn" style="display:none" onclick="nextPack()">
        <i class="fa-solid fa-box-open"></i>&nbsp;Next Pack
      </button>
      <button class="btn-primary" onclick="goCollection()">
        <i class="fa-solid fa-book-open"></i>&nbsp;View Collection
      </button>
    </div>
  </div>

  <script src="/nav-user-menu.js"></script>
  <script src="/pack-opening.js"></script>
</body>
</html>
