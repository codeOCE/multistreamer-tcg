<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="castle-public-url" content="https://tcg.creatorcastle.gg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Open Pack · Castle TCG</title>
  <link rel="icon" type="image/png" href="https://cdn.codeoce.com/logo/logo_white.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07080d;
      color: #e8eaf0;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Ambient glow ── */
    #bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 50% 60%, rgba(99,102,241,.14) 0%, transparent 70%);
      transition: background 1.4s ease;
    }

    /* ── Particle canvas ── */
    #fx-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    /* ── Flash ── */
    #flash {
      position: fixed; inset: 0; z-index: 999; pointer-events: none;
      background: #fff; opacity: 0; transition: opacity .06s;
    }

    /* ── Back btn ── */
    #back-btn {
      position: fixed; top: 18px; left: 18px; z-index: 600;
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.4); font-size: .85rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    #back-btn:hover { color: #fff; border-color: rgba(255,255,255,.22); }

    /* ── Pack counter chip ── */
    #pack-chip {
      position: fixed; top: 18px; right: 18px; z-index: 600;
      padding: 6px 14px; border-radius: 99px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
      font-size: .5rem; font-weight: 800; letter-spacing: .18em;
      text-transform: uppercase; color: rgba(255,255,255,.3);
      display: none;
    }

    /* ════════════════════════════════════════
       SCREENS
    ════════════════════════════════════════ */
    .screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      transition: opacity .35s ease, transform .35s ease;
    }
    .screen.out { opacity: 0; pointer-events: none; transform: scale(.97); }

    /* ── Loading ── */
    #s-loading p {
      margin-top: 14px; font-size: .55rem; font-weight: 800;
      letter-spacing: .24em; text-transform: uppercase; color: rgba(255,255,255,.22);
    }
    .spin {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.07);
      border-top-color: #6366f1;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty ── */
    #s-empty { text-align: center; gap: 16px; }
    #s-empty .ico { font-size: 2.8rem; opacity: .07; }
    #s-empty h2 { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; }
    #s-empty p { font-size: .65rem; color: rgba(255,255,255,.35); max-width: 280px; line-height: 1.7; }
    .empty-cta {
      margin-top: 12px; text-decoration: none; display: inline-block;
      padding: 14px 36px; border-radius: 12px; background: #6366f1;
      color: #fff; font-weight: 900; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
    }

    /* ══════════════════════════════════════
       LOBBY
    ══════════════════════════════════════ */
    #s-lobby { gap: 32px; }
    .lobby-sub {
      font-size: .5rem; font-weight: 800; letter-spacing: .28em;
      text-transform: uppercase; color: rgba(255,255,255,.25); text-align: center;
    }
    .lobby-title {
      font-size: clamp(1.6rem, 5vw, 2.6rem); font-weight: 900;
      text-transform: uppercase; letter-spacing: -.04em; line-height: 1; text-align: center;
    }
    .lobby-title span { color: #6366f1; }

    /* 3D floating pack — perspective lives on the parent */
    #lobby-perspective {
      perspective: 800px; perspective-origin: 50% 50%;
      width: min(180px, 42vw); height: min(300px, 70vw);
    }
    #lobby-pack-wrap {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: packFloat 5s ease-in-out infinite;
      filter:
        drop-shadow(0 40px 50px rgba(0,0,0,.9))
        drop-shadow(0 0 40px rgba(99,102,241,.35));
    }
    #lobby-pack-wrap img {
      width: 100%; height: 100%; object-fit: contain;
      border-radius: 12px; display: block; cursor: pointer;
    }
    @keyframes packFloat {
      0%   { transform: rotateX(10deg) rotateY(-8deg) translateY(0px); }
      30%  { transform: rotateX(-4deg) rotateY(11deg) translateY(-16px); }
      65%  { transform: rotateX(7deg)  rotateY(-10deg) translateY(-9px); }
      100% { transform: rotateX(10deg) rotateY(-8deg) translateY(0px); }
    }

    /* ── Holographic foil — very subtle tint, pack art stays visible ── */
    .pack-foil {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 2;
      background: linear-gradient(
        var(--foil-angle, 130deg),
        hsla(320,80%,60%,.35) 0%,  hsla(30,80%,60%,.28) 20%,
        hsla(60,80%,55%,.28)  40%, hsla(150,80%,50%,.28) 55%,
        hsla(210,80%,65%,.35) 70%, hsla(270,80%,65%,.35) 85%,
        hsla(320,80%,60%,.35) 100%
      );
      mix-blend-mode: soft-light;
      opacity: .6;
      transition: opacity .3s;
    }
    /* Single thin specular sweep — subtle, not a full rainbow wash */
    .pack-shimmer {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 3;
      background: linear-gradient(
        calc(var(--foil-angle, 130deg) + 20deg),
        transparent 0%, transparent 42%,
        rgba(255,255,255,.15) 49%,
        rgba(255,255,255,.15) 51%,
        transparent 58%
      );
      background-size: 200% 200%;
      animation: shimmerSweep 3.5s ease-in-out infinite alternate;
    }
    @keyframes shimmerSweep {
      0%   { background-position: 120% 120%; }
      100% { background-position: -120% -120%; }
    }
    /* Specular highlight — follows mouse */
    .pack-shine {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 4;
      background: radial-gradient(
        ellipse 55% 40% at var(--shine-x, 30%) var(--shine-y, 22%),
        rgba(255,255,255,.32) 0%, rgba(255,255,255,.06) 50%, transparent 70%
      );
    }
    /* Rim light — physical edge depth */
    .pack-rim {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 5;
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.22),
        inset -1px -2px 0 rgba(0,0,0,.55),
        inset 0 0 30px rgba(0,0,0,.18);
    }

    .lobby-btn {
      padding: 16px 48px; border-radius: 14px; border: none;
      background: #6366f1; color: #fff; font-family: 'Outfit', sans-serif;
      font-size: .95rem; font-weight: 900; letter-spacing: .06em;
      text-transform: uppercase; cursor: pointer;
      box-shadow: 0 8px 32px rgba(99,102,241,.4);
      transition: transform .15s, box-shadow .15s;
    }
    .lobby-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 42px rgba(99,102,241,.55); }
    .lobby-btn:active { transform: scale(.97); }

    /* ══════════════════════════════════════
       TRACE / OPEN STAGE
    ══════════════════════════════════════ */
    #s-open { background: transparent; gap: 0; }

    #open-stage {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      perspective: 900px;
      perspective-origin: 50% 42%;
    }

    /* 3D scene — JS drives the tilt via style.transform */
    #pack-scene {
      transform-style: preserve-3d;
      transition: transform .08s ease;
      animation: packDrift 5s ease-in-out infinite;
    }
    @keyframes packDrift {
      0%   { transform: rotateX(10deg) rotateY(-8deg); }
      35%  { transform: rotateX(-3deg) rotateY(10deg); }
      70%  { transform: rotateX(7deg)  rotateY(-10deg); }
      100% { transform: rotateX(10deg) rotateY(-8deg); }
    }
    /* Freeze animation while user is actively tracing */
    #pack-scene.tracing { animation-play-state: paused; }

    #pack-wrap {
      position: relative;
      width: min(220px, 46vw);
      height: min(366px, 77vw);
      cursor: crosshair;
      touch-action: none;
      transform-style: preserve-3d;
      filter:
        drop-shadow(0 50px 70px rgba(0,0,0,.9))
        drop-shadow(0 0 50px rgba(99,102,241,.35))
        drop-shadow(0 0 12px rgba(150,100,255,.3));
    }

    /* split halves — background-image set by JS */
    .pack-half {
      position: absolute; left: 0; width: 100%;
      overflow: hidden;
      background-repeat: no-repeat;
    }
    #pack-top { top: 0;    height: 12%; border-radius: 12px 12px 0 0;
      transition: transform .75s cubic-bezier(.2,0,.4,1), opacity .6s ease; }
    #pack-bot { bottom: 0; height: 88%; border-radius: 0 0 12px 12px;
      transition: transform .6s cubic-bezier(.4,0,.2,1), opacity .6s ease; }

    /* Foil on open pack — subtle soft-light, pack art stays hero */
    #open-pack-foil {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 4;
      background: linear-gradient(
        var(--foil-angle, 125deg),
        hsla(320,80%,60%,.35) 0%,  hsla(30,80%,60%,.28) 20%,
        hsla(60,80%,55%,.28)  40%, hsla(150,80%,50%,.28) 55%,
        hsla(210,80%,65%,.35) 70%, hsla(270,80%,65%,.35) 85%,
        hsla(320,80%,60%,.35) 100%
      );
      mix-blend-mode: soft-light;
      opacity: .65;
    }
    /* Thin specular sweep */
    #open-pack-shimmer {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 5;
      background: linear-gradient(
        calc(var(--foil-angle, 125deg) + 20deg),
        transparent 0%, transparent 42%,
        rgba(255,255,255,.18) 49%,
        rgba(255,255,255,.18) 51%,
        transparent 58%
      );
      background-size: 200% 200%;
      animation: shimmerSweep 3s ease-in-out infinite alternate;
    }
    /* Specular highlight follows mouse */
    #open-pack-shine {
      position: absolute; inset: 0; border-radius: 12px;
      pointer-events: none; z-index: 6;
      background: radial-gradient(
        ellipse 55% 40% at var(--shine-x, 35%) var(--shine-y, 25%),
        rgba(255,255,255,.35) 0%, rgba(255,255,255,.05) 50%, transparent 70%
      );
    }
    /* Ambient cut-line glow — always visible, pulses to invite interaction */
    #trace-line {
      position: absolute; left: -4px; right: -4px; top: 12%;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%, rgba(0,212,255,.7) 15%,
        #00eeff 50%, rgba(0,212,255,.7) 85%, transparent 100%
      );
      box-shadow: 0 0 12px 3px rgba(0,212,255,.6), 0 0 30px 8px rgba(0,212,255,.25);
      pointer-events: none; z-index: 8;
      animation: cutLinePulse 2s ease-in-out infinite;
    }
    @keyframes cutLinePulse {
      0%,100% { opacity: .55; box-shadow: 0 0 10px 3px rgba(0,212,255,.55), 0 0 28px 8px rgba(0,212,255,.2); }
      50%     { opacity: 1;   box-shadow: 0 0 18px 6px rgba(0,212,255,.9),  0 0 50px 16px rgba(0,212,255,.4); }
    }

    /* Electric glow fill — grows from touch point */
    #trace-fill {
      position: absolute; top: 12%;
      height: 3px; width: 0px; left: 0;
      background: linear-gradient(90deg, transparent, #00d4ff 10%, #fff 50%, #00d4ff 90%, transparent);
      box-shadow: 0 0 20px 6px rgba(0,212,255,1), 0 0 55px 18px rgba(0,212,255,.55);
      pointer-events: none; z-index: 9;
    }

    /* Hint */
    #trace-hint {
      position: absolute; bottom: -54px; left: 50%;
      transform: translateX(-50%);
      font-size: .52rem; font-weight: 800; letter-spacing: .22em;
      text-transform: uppercase; color: rgba(255,255,255,.32); white-space: nowrap;
      animation: pulseHint 2s ease-in-out infinite;
    }
    @keyframes pulseHint { 0%,100%{opacity:.28} 50%{opacity:1} }

    /* Slice physics — top flies off, bot drops */
    @keyframes topFlyOff {
      0%   { transform: translateY(0)    rotate(0deg)   translateX(0); opacity: 1; }
      15%  { transform: translateY(-18px) rotate(-5deg)  translateX(8px); opacity: 1; }
      100% { transform: translateY(-200%) rotate(-28deg) translateX(70px); opacity: 0; }
    }
    #pack-wrap.sliced #pack-top  { animation: topFlyOff .9s cubic-bezier(.3,0,.5,1) forwards; }
    #pack-wrap.sliced #pack-bot  { transform: translateY(36px) scaleY(.97); opacity: 0; }
    #pack-wrap.sliced #trace-hint     { opacity: 0; pointer-events: none; }
    #pack-wrap.sliced #trace-scissors { display: none; }
    #pack-wrap.sliced #trace-fill     { opacity: 0; }
    #pack-wrap.sliced #trace-line     { opacity: 0; }

    /* ══════════════════════════════════════
       REVEAL SCREEN
    ══════════════════════════════════════ */
    #s-reveal {
      gap: 6px;
      background: transparent;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      overflow: hidden;
    }

    /* Middle row — card is the only in-flow child, actions + details are absolute */
    #rev-mid-row {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
    }

    /* Card stage — centered via flex parent */
    #rev-stage {
      position: relative;
      width: min(270px, 58vw);
      height: min(378px, 81vw);
      flex-shrink: 0;
      perspective: 900px;
      overflow: visible;
    }

    .rev-card {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      transition: transform .38s cubic-bezier(.4,0,.2,1), opacity .38s ease;
      cursor: default;
      user-select: none;
      -webkit-user-drag: none;
    }
    .rev-card img { pointer-events: none; user-select: none; -webkit-user-drag: none; }

    /* Tilt wrapper — separate from flip so they never fight */
    .rev-tilt {
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .08s ease;
    }

    .rev-inner {
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .6s cubic-bezier(.16,1,.3,1);
      border-radius: 14px;
    }
    .rev-card.flipped .rev-inner { transform: rotateY(180deg); }
    /* Click a revealed card to flip it back to its card-back for inspection. */
    .rev-card.flipped.show-back .rev-inner { transform: rotateY(0deg); }
    .rev-card[data-idx].flipped { cursor: pointer; }
    /* Favourited card glow during reveal. */
    .rev-card.is-fav .rev-face {
      box-shadow: 0 0 0 2px rgba(248,113,113,.65),
                  0 0 36px 4px rgba(248,113,113,.45),
                  0 32px 80px rgba(0,0,0,.75);
    }

    .rev-back, .rev-face {
      position: absolute; inset: 0;
      border-radius: 14px;
      backface-visibility: hidden; overflow: hidden;
    }
    .rev-back {
      background: linear-gradient(135deg, #1b1d2e 0%, #0d0f19 100%);
      border: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 32px 80px rgba(0,0,0,.75);
    }
    .back-logo { width: 50px; opacity: .1; }

    .rev-face {
      transform: rotateY(180deg);
      background: #0d0f14;
      box-shadow: 0 32px 80px rgba(0,0,0,.75);
    }
    .rev-face > img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 14px; }

    /* Holographic foil on face */
    .rev-holo {
      position: absolute; inset: 0; border-radius: 14px;
      pointer-events: none;
      background: linear-gradient(
        var(--holo-angle, 135deg),
        rgba(255,0,128,.22) 0%, rgba(255,128,0,.18) 16%,
        rgba(255,255,0,.18) 33%, rgba(0,255,128,.18) 50%,
        rgba(0,128,255,.18) 66%, rgba(128,0,255,.22) 83%,
        rgba(255,0,128,.22) 100%
      );
      mix-blend-mode: color-dodge;
      opacity: 0; transition: opacity .5s ease .3s;
    }
    .rev-card.flipped .rev-holo { opacity: var(--holo-opacity, 0); }

    /* Shine sweep */
    .rev-shine {
      position: absolute; inset: 0; border-radius: 14px;
      pointer-events: none;
      background: radial-gradient(
        ellipse 55% 38% at var(--mx, 50%) var(--my, 50%),
        rgba(255,255,255,.16) 0%, transparent 70%
      );
    }

    /* Rarity glow ring */
    .rev-face::after {
      content: ''; position: absolute; inset: 0; border-radius: 14px;
      pointer-events: none; opacity: 0; transition: opacity .5s ease .5s;
    }
    .rev-card.flipped .rev-face::after { opacity: 1; }
    .rev-card[data-r="Uncommon"] .rev-face::after  { box-shadow: inset 0 0 0 2px rgba(96,165,250,.6),  0 0 28px rgba(96,165,250,.4); }
    .rev-card[data-r="Rare"] .rev-face::after       { box-shadow: inset 0 0 0 2px rgba(250,204,21,.8),  0 0 36px rgba(250,204,21,.5); }
    .rev-card[data-r="Epic"] .rev-face::after       { box-shadow: inset 0 0 0 2px rgba(139,92,246,.9),  0 0 40px rgba(139,92,246,.55); }
    .rev-card[data-r="Legendary"] .rev-face::after,
    .rev-card[data-r="Secret"] .rev-face::after     { box-shadow: inset 0 0 0 2px rgba(217,70,239,.95), 0 0 52px rgba(217,70,239,.65), 0 0 90px rgba(217,70,239,.3); }

    /* Card name + rarity above card */
    #rev-info {
      text-align: center;
      opacity: 0; transform: translateY(8px);
      transition: opacity .3s ease .65s, transform .3s ease .65s;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    #rev-info.show { opacity: 1; transform: none; }
    #rev-card-name {
      font-size: clamp(1.9rem, 6.5vw, 3.2rem); font-weight: 900;
      letter-spacing: -.03em; text-transform: uppercase; line-height: 1;
    }
    #rev-card-rarity {
      display: inline-block;
      padding: 5px 18px; border-radius: 99px;
      font-size: .58rem; font-weight: 900; letter-spacing: .18em;
      text-transform: uppercase;
    }
    #rev-card-rarity.rc-common    { background: rgba(255,255,255,.08); color: rgba(255,255,255,.5); }
    #rev-card-rarity.rc-uncommon  { background: rgba(96,165,250,.15);  color: #93c5fd; }
    #rev-card-rarity.rc-rare      { background: rgba(250,204,21,.15);  color: #fde047; }
    #rev-card-rarity.rc-epic      { background: rgba(139,92,246,.18);  color: #c4b5fd; }
    #rev-card-rarity.rc-legendary,
    #rev-card-rarity.rc-secret    { background: rgba(217,70,239,.18);  color: #f0abfc; }
    #rev-dup-badge {
      margin-top: 8px; display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 99px;
      font-size: .5rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      background: rgba(253,224,71,.12); color: #fde047; border: 1px solid rgba(253,224,71,.3);
    }
    #rev-dup-badge.hide { display: none; }
    #rev-dup-badge em { font-style: normal; opacity: .8; }

    /* ── Card action buttons — absolute, left of card ── */
    #rev-actions {
      position: absolute;
      right: calc(50% + min(135px, 29vw) + 16px);
      top: 50%;
      display: flex; flex-direction: column; gap: 10px; align-items: center;
      opacity: 0; transform: translateY(-50%) translateX(-8px); pointer-events: none;
      transition: opacity .3s ease .9s, transform .3s ease .9s;
    }
    #rev-actions.show { opacity: 1; transform: translateY(-50%); pointer-events: auto; }

    /* ── Bottom nav buttons ── */
    #rev-bottom-btns {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      margin-top: 6px;
      opacity: 0; transform: translateY(6px); pointer-events: none;
      transition: opacity .3s ease .9s, transform .3s ease .9s;
    }
    #rev-bottom-btns.show { opacity: 1; transform: none; pointer-events: auto; }

    /* Card Details ghost button */
    #rev-details-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 28px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.4); font-family: 'Outfit', sans-serif;
      font-size: .62rem; font-weight: 900; letter-spacing: .18em;
      text-transform: uppercase; cursor: pointer;
      transition: all .2s; -webkit-tap-highlight-color: transparent;
    }
    #rev-details-btn:hover { border-color: rgba(255,255,255,.2); color: rgba(255,255,255,.75); }
    #rev-details-btn.active {
      background: rgba(99,102,241,.12); border-color: rgba(99,102,241,.35); color: #a5b4fc;
    }

    /* Next Card / Results primary button */
    #rev-next-btn {
      padding: 17px 64px; border-radius: 16px; border: none;
      background: #6366f1; color: #fff; font-family: 'Outfit', sans-serif;
      font-size: .9rem; font-weight: 900; letter-spacing: .1em;
      text-transform: uppercase; cursor: pointer;
      box-shadow: 0 6px 24px rgba(99,102,241,.45);
      transition: transform .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    #rev-next-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(99,102,241,.6); }
    #rev-next-btn:active { transform: scale(.97); }

    /* ── Card details panel — absolute, right of card ── */
    #rev-details-panel {
      position: absolute;
      left: calc(50% + min(135px, 29vw) + 16px);
      top: 0;
      width: 0; overflow: hidden;
      transition: width .4s cubic-bezier(.16,1,.3,1);
    }
    #rev-details-panel.open { width: 190px; }
    #rev-details-inner {
      width: 190px; padding-left: 14px;
      display: flex; flex-direction: column; gap: 14px;
    }
    #rev-desc-text {
      font-size: .57rem; line-height: 1.72; color: rgba(255,255,255,.4);
    }
    #rev-desc-text:empty::before {
      content: 'No description available.';
      color: rgba(255,255,255,.2); font-style: italic;
    }
    #rev-tag-list { display: flex; flex-direction: column; gap: 7px; }
    .rev-tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 7px; align-self: flex-start;
      font-size: .42rem; font-weight: 900; letter-spacing: .14em;
      text-transform: uppercase; border: 1px solid; white-space: nowrap;
    }
    .rtag-rarity-common    { background: rgba(255,255,255,.05);  color: rgba(255,255,255,.45); border-color: rgba(255,255,255,.09); }
    .rtag-rarity-uncommon  { background: rgba(96,165,250,.08);   color: #93c5fd; border-color: rgba(96,165,250,.22); }
    .rtag-rarity-rare      { background: rgba(250,204,21,.08);   color: #fde047; border-color: rgba(250,204,21,.22); }
    .rtag-rarity-epic      { background: rgba(139,92,246,.1);    color: #c4b5fd; border-color: rgba(139,92,246,.28); }
    .rtag-rarity-legendary,
    .rtag-rarity-secret    { background: rgba(217,70,239,.1);    color: #f0abfc; border-color: rgba(217,70,239,.28); }
    .rtag-trait  { background: rgba(99,102,241,.08);  color: #a5b4fc; border-color: rgba(99,102,241,.2); }
    .rtag-type   { background: rgba(52,211,153,.06);  color: #6ee7b7; border-color: rgba(52,211,153,.16); }
    .rtag-hp     { background: rgba(248,113,113,.07); color: #fca5a5; border-color: rgba(248,113,113,.16); }
    .rtag-number { background: rgba(255,255,255,.04); color: rgba(255,255,255,.28); border-color: rgba(255,255,255,.07); }
    .rtag-set    { background: rgba(255,255,255,.03); color: rgba(255,255,255,.25); border-color: rgba(255,255,255,.06); }

    /* Swipe hint */
    #rev-swipe-hint {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      font-size: .5rem; font-weight: 800; letter-spacing: .2em;
      text-transform: uppercase; color: rgba(255,255,255,.22);
      white-space: nowrap; pointer-events: none; z-index: 20;
      animation: pulseHint 2.5s ease-in-out infinite;
    }
    #rev-swipe-hint.hide { display: none; }

    /* ══════════════════════════════════════
       RESULTS
    ══════════════════════════════════════ */
    #s-results {
      gap: 22px; overflow-y: auto; justify-content: flex-start;
      padding: 70px 16px 48px;
    }
    .res-title {
      /* Scales with viewport AND with how many cards were pulled (--res-title-scale,
         set in JS) so a 30-card merge-open doesn't dominate the screen. */
      font-size: calc(clamp(1.1rem, 4vw, 1.9rem) * var(--res-title-scale, 1));
      font-weight: 900;
      text-transform: uppercase; letter-spacing: -.03em; text-align: center;
    }
    .res-title span { color: #6366f1; }
    .res-grid {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; max-width: 680px;
    }
    .res-card {
      width: var(--res-card-w, 96px);
      position: relative;
      display: flex; flex-direction: column; gap: 5px;
      animation: fadeUp .4s ease both;
    }
    .res-card--dup img { outline: 1px solid rgba(253,224,71,.45); }
    .res-dup-tag {
      position: absolute; top: 5px; right: 5px;
      padding: 1px 5px; border-radius: 5px;
      font-size: .4rem; font-weight: 900; letter-spacing: .08em;
      background: rgba(253,224,71,.9); color: #1a1606;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    .res-card img {
      width: var(--res-card-w, 96px); height: calc(var(--res-card-w, 96px) * 1.4);
      object-fit: cover;
      border-radius: 8px; border: 1px solid rgba(255,255,255,.07);
    }
    .res-name {
      font-size: .5rem; font-weight: 700; color: rgba(255,255,255,.7);
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .res-rar {
      font-size: .42rem; font-weight: 900; letter-spacing: .1em;
      text-transform: uppercase; text-align: center;
    }
    .rc-common   { color: rgba(255,255,255,.38); }
    .rc-uncommon { color: #93c5fd; }
    .rc-rare     { color: #fde047; }
    .rc-epic     { color: #c4b5fd; }
    .rc-legendary, .rc-secret { color: #f0abfc; }

    .res-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn-ghost {
      padding: 11px 24px; border-radius: 11px;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.6); font-family: 'Outfit', sans-serif;
      font-size: .65rem; font-weight: 900; letter-spacing: .1em;
      text-transform: uppercase; cursor: pointer; transition: all .2s;
    }
    .btn-ghost:hover { border-color: rgba(255,255,255,.22); color: #fff; }
    .btn-primary {
      padding: 11px 32px; border-radius: 11px; border: none;
      background: #6366f1; color: #fff; font-family: 'Outfit', sans-serif;
      font-size: .65rem; font-weight: 900; letter-spacing: .1em;
      text-transform: uppercase; cursor: pointer;
      box-shadow: 0 4px 20px rgba(99,102,241,.4); transition: all .2s;
    }
    .btn-primary:hover { box-shadow: 0 8px 32px rgba(99,102,241,.55); transform: translateY(-1px); }

    @media (max-width: 520px) {
      #rev-stage { width: min(210px, 52vw); height: min(294px, 73vw); }
      #rev-card-name { font-size: clamp(1.4rem, 8vw, 2rem); }
      #rev-actions { right: calc(50% + min(105px, 26vw) + 12px); }
      #rev-details-panel { left: calc(50% + min(105px, 26vw) + 12px); }
      #rev-details-panel.open { width: 140px; }
      #rev-details-inner { width: 140px; }
      #rev-next-btn { padding: 14px 44px; font-size: .78rem; }
    }

    /* ── Lobby: merge toggle ── */
    #s-lobby { gap: 20px; }
    .lobby-merge-row {
      display: none; align-items: center; gap: 10px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .toggle-pill {
      width: 34px; height: 18px; border-radius: 9px; flex-shrink: 0;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
      position: relative; transition: background .2s, border-color .2s;
    }
    .toggle-pill.on { background: rgba(99,102,241,.65); border-color: transparent; }
    .toggle-knob {
      position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255,255,255,.35); transition: transform .2s, background .2s;
    }
    .toggle-pill.on .toggle-knob { transform: translateX(16px); background: #fff; }
    .merge-label {
      font-size: .46rem; font-weight: 800; letter-spacing: .16em;
      text-transform: uppercase; color: rgba(255,255,255,.25); line-height: 1.5;
    }

    /* ── Reveal: streamer badge ── */
    #streamer-badge {
      display: flex; align-items: center; gap: 7px;
      padding: 4px 12px 4px 8px; border-radius: 99px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
      font-size: .44rem; font-weight: 800; letter-spacing: .14em;
      text-transform: uppercase; color: rgba(255,255,255,.28);
      opacity: 0; transition: opacity .3s ease .5s; pointer-events: none;
    }
    #streamer-badge.show { opacity: 1; }
    #streamer-avatar-badge {
      width: 16px; height: 16px; border-radius: 50%;
      object-fit: cover; background: rgba(255,255,255,.08); display: none;
    }

    /* ── Reveal: icon action buttons ── */
    .rev-act-btn {
      width: 48px; height: 48px; border-radius: 14px;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.35); font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; -webkit-tap-highlight-color: transparent;
    }
    .rev-act-btn:hover { border-color: rgba(255,255,255,.22); color: rgba(255,255,255,.8); }
    #btn-fav.fav-on       { color: #f87171; border-color: rgba(248,113,113,.3); background: rgba(248,113,113,.07); }
    #btn-dust:hover       { color: #fde047; border-color: rgba(253,224,71,.25); }
    #btn-market:hover     { color: #34d399; border-color: rgba(52,211,153,.25); }
    #btn-market.listed-on { color: #34d399; border-color: rgba(52,211,153,.3); background: rgba(52,211,153,.07); }

    /* ── Reveal: in-screen toast ── */
    #rev-toast {
      position: absolute; bottom: 190px; left: 50%;
      transform: translateX(-50%);
      background: rgba(18,18,28,.92); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
      padding: 8px 20px; font-size: .88rem; font-weight: 600;
      white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity .25s;
      z-index: 30;
    }
    #rev-toast.show    { opacity: 1; }
    #rev-toast.dust    { color: #fde047; border-color: rgba(253,224,71,.3); }
    #rev-toast.success { color: #34d399; border-color: rgba(52,211,153,.3); }
    #rev-toast.error   { color: #f87171; border-color: rgba(248,113,113,.3); }

    /* ── Choose-your-set picker ── */
    #lobby-set-picker { width: 100%; max-width: 460px; }
    #lobby-set-picker.hidden { display: none; }
    #lobby-set-picker .lsp-title {
      font-size: 0.72rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.6); text-align: center; margin-bottom: 14px;
    }
    #lobby-set-picker .lsp-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
      gap: 12px; justify-content: center;
    }
    .lsp-tile {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 12px 8px; cursor: pointer; color: #fff;
      font: inherit; transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .lsp-tile:hover { transform: translateY(-3px); border-color: #6366f1; background: rgba(99,102,241,0.12); }
    .lsp-tile img, .lsp-tile .lsp-noimg {
      width: 64px; height: 90px; object-fit: contain; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05); font-size: 1.4rem; color: rgba(255,255,255,0.5);
    }
    .lsp-tile span {
      font-size: 0.62rem; font-weight: 700; text-align: center; line-height: 1.2;
      max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .lsp-surprise { border-style: dashed; }

    /* ── Embed mode: transparent over parent backdrop ── */
    body.embed-mode,
    html.embed-mode { background: transparent !important; }
    body.embed-mode #bg-glow { display: none; }
  </style>
    <script src="/castle-prefs.js"></script>
</head>
<body>
  <div id="bg-glow"></div>
  <canvas id="fx-canvas"></canvas>
  <div id="flash"></div>

  <button id="back-btn" onclick="packGoBack()"><i class="fa-solid fa-chevron-left"></i></button>
  <div id="pack-chip"></div>

  <!-- Loading -->
  <div class="screen" id="s-loading">
    <div class="spin"></div>
    <p>Loading…</p>
  </div>

  <!-- Empty -->
  <div class="screen out" id="s-empty">
    <div class="ico"><i class="fa-solid fa-box-open"></i></div>
    <h2>No packs to open</h2>
    <p>Purchase a pack from a creator's page or earn one through channel points, subs, or bits.</p>
    <a class="empty-cta" href="/my-collection.html">View Collection</a>
  </div>

  <!-- Lobby -->
  <div class="screen out" id="s-lobby">
    <p class="lobby-sub" id="lobby-streamer-name">Castle TCG</p>
    <h1 class="lobby-title">Open Your <span>Pack</span></h1>
    <div id="lobby-perspective">
    <div id="lobby-pack-wrap">
      <img id="lobby-img" src="https://cdn.codeoce.com/branding/default-pack.png" alt="Pack">
    </div>
    </div>
    <button class="lobby-btn" onclick="beginOpen()">
      <i class="fa-solid fa-bolt" style="margin-right:8px"></i>Open Pack
    </button>
    <div id="lobby-set-picker" class="hidden"></div>
    <div class="lobby-merge-row" id="merge-toggle-row" onclick="toggleMergeMode()">
      <div class="toggle-pill" id="merge-pill"><div class="toggle-knob"></div></div>
      <span class="merge-label">Merge all <span id="merge-count">?</span> packs from this streamer</span>
    </div>
  </div>

  <!-- Trace / slice stage -->
  <div class="screen out" id="s-open">
    <div id="open-stage">
      <div id="pack-scene">
        <div id="pack-wrap">
          <div class="pack-half" id="pack-top"></div>
          <div class="pack-half" id="pack-bot"></div>
          <div id="trace-line"></div>
          <div id="trace-fill"></div>
          <div id="trace-hint">Slide to cut open</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Reveal (one card at a time) -->
  <div class="screen out" id="s-reveal">

    <!-- Card name + rarity badge — above the card -->
    <div id="rev-info">
      <div id="rev-card-name"></div>
      <div id="rev-card-rarity"></div>
      <div id="rev-dup-badge" class="hide"><i class="fa-solid fa-layer-group"></i> <span>Duplicate</span> <em id="rev-dup-frag"></em></div>
    </div>

    <!-- Middle row: [action buttons] [card] [details panel] -->
    <div id="rev-mid-row">
      <div id="rev-actions">
        <button class="rev-act-btn" id="btn-fav" title="Favourite (F)" onclick="favouriteCurrentCard()">
          <i class="fa-regular fa-heart"></i>
        </button>
        <button class="rev-act-btn" id="btn-dust" title="Burn for fragments" onclick="dustCurrentCard()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="m21.55 11.17-1.26-.84c-.23-.15-.39-.38-.45-.67-.07-.3-.01-.6.15-.84l.84-1.26c.2-.31.22-.7.05-1.03A.98.98 0 0 0 20 6h-2.07a.87.87 0 0 1-.54-.17c-.17-.14-.29-.29-.35-.44l-1.1-2.76c-.11-.27-.33-.48-.61-.58-.28-.09-.58-.06-.83.09l-2.52 1.51c-.39.24-.78.38-1.19.43-.99.13-2.01-.15-2.79-.78L6.64 2.21a1.004 1.004 0 0 0-1.63.78v4.49c0 .1-.05.21-.1.29a.47.47 0 0 1-.4.22h-1.5c-.4 0-.77.24-.92.62-.15.37-.07.8.22 1.09l1.42 1.42c.19.19.31.4.33.62.05.45-.1.89-.41 1.2l-1.34 1.34c-.29.29-.37.72-.22 1.09s.52.62.92.62H6.1c.2 0 .39.06.54.18.24.19.37.45.37.72v4.09c0 .4.24.77.62.92a.995.995 0 0 0 1.09-.21l2.76-2.76c.57-.57 1.28-.94 2.1-1.08.92-.16 1.88-.02 2.71.4l1.27.64a.995.995 0 0 0 1.42-1.09l-.45-2.23c-.05-.26 0-.54.17-.75v-.01c.08-.11.16-.19.25-.25l2.6-1.73c.28-.19.45-.5.45-.83s-.17-.65-.45-.83m-3.71 1.73c-.27.18-.52.43-.74.71l-.02.02c-.49.67-.68 1.52-.52 2.33l.05.26a6.55 6.55 0 0 0-3.43-.33c-1.2.21-2.28.77-3.14 1.63l-1.06 1.06V16.9c0-.88-.41-1.72-1.13-2.3-.49-.39-1.12-.61-1.77-.61h-.72c.54-.71.78-1.6.66-2.51-.07-.58-.33-1.14-.75-1.62.56-.19 1.04-.56 1.35-1.08.25-.42.37-.85.37-1.3V5.06c1.17.83 2.62 1.19 4.06 1 .65-.08 1.3-.32 1.93-.7l1.51-.91.67 1.67c.19.48.51.9.97 1.26.48.39 1.12.6 1.79.6h.23c-.32.63-.42 1.38-.26 2.1.17.78.63 1.45 1.29 1.89h.01l-1.35.91Z"/></svg>
        </button>
        <button class="rev-act-btn" id="btn-market" title="Send to trade pile" onclick="marketCurrentCard()">
          <i class="fa-solid fa-store"></i>
        </button>
      </div>
      <div id="rev-stage"><!-- card injected by JS --></div>
      <div id="rev-details-panel">
        <div id="rev-details-inner">
          <div id="rev-desc-text"></div>
          <div id="rev-tag-list"></div>
        </div>
      </div>
    </div>

    <!-- Bottom: Card Details toggle + Next Card -->
    <div id="rev-bottom-btns">
      <button id="rev-details-btn" onclick="toggleCardDetails()">
        <i class="fa-solid fa-circle-info"></i>
        Card Details
      </button>
      <button id="rev-next-btn" onclick="nextCard()">Next Card</button>
    </div>

    <div id="rev-toast"></div>
  </div>
  <div id="rev-swipe-hint" class="hide">Tap card to flip</div>

  <!-- Results -->
  <div class="screen out" id="s-results">
    <h2 class="res-title">You got <span id="res-count">0</span> cards!</h2>
    <div class="res-grid" id="res-grid"></div>
    <div class="res-actions">
      <button class="btn-ghost" id="next-btn" style="display:none" onclick="nextPack()">
        <i class="fa-solid fa-box-open"></i>&nbsp;Next Pack
      </button>
      <button class="btn-primary" onclick="goCollection()">
        <i class="fa-solid fa-book-open"></i>&nbsp;View Collection
      </button>
    </div>
  </div>

  <script src="/nav-user-menu.js"></script>
  <script src="/nav-notifications.js"></script>
  <script src="/pack-opening.js"></script>
</body>
</html>
