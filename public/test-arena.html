<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Arena Debugger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            color: white;
            font-family: inherit;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        button {
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        #log {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #020617;
            border-radius: 0.5rem;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-entry {
            margin-bottom: 0.25rem;
            color: #64748b;
        }

        .log-success {
            color: #4ade80;
        }

        .log-error {
            color: #f87171;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1><i class="fas fa-swords"></i> Battle Arena Debugger</h1>

        <div class="form-group">
            <label for="challenger">Challenger Username</label>
            <input type="text" id="challenger" value="codeOCE" placeholder="e.g. codeOCE">
        </div>

        <div class="form-group">
            <label for="target">Target Username</label>
            <input type="text" id="target" value="sadAthena" placeholder="e.g. sadAthena">
        </div>

        <div class="buttons">
            <button class="btn-primary" onclick="initiateBattle()">
                <i class="fas fa-plus-circle"></i> Init Battle
            </button>
            <button class="btn-secondary" onclick="acceptBattle()">
                <i class="fas fa-check-circle"></i> Accept (Target)
            </button>
        </div>

        <div id="log">
            <div class="log-entry">Waiting for action...</div>
        </div>
    </div>

    <script>
        const logEl = document.getElementById('log');

        function addLog(msg, type = '') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type ? 'log-' + type : ''}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.prepend(entry);
        }

        async function initiateBattle() {
            const challenger = document.getElementById('challenger').value.trim();
            const target = document.getElementById('target').value.trim();

            if (!challenger || !target) {
                addLog('Error: Fill in both names!', 'error');
                return;
            }

            addLog(`Initiating: ${challenger} vs ${target}...`);
            try {
                const res = await fetch(`/api/public/battle/initiate?challenger=${encodeURIComponent(challenger)}&target=${encodeURIComponent(target)}`);
                const text = await res.text();
                addLog(`Server: ${text}`, res.ok ? 'success' : 'error');
            } catch (err) {
                addLog(`Fetch Error: ${err.message}`, 'error');
            }
        }

        async function acceptBattle() {
            const target = document.getElementById('target').value.trim();

            if (!target) {
                addLog('Error: Fill in target name to accept!', 'error');
                return;
            }

            addLog(`Accepting battle for ${target}...`);
            try {
                const res = await fetch(`/api/public/battle/accept?user=${encodeURIComponent(target)}`);
                const text = await res.text();
                addLog(`Server: ${text}`, res.ok ? 'success' : 'error');
            } catch (err) {
                addLog(`Fetch Error: ${err.message}`, 'error');
            }
        }
    </script>
</body>

</html>
