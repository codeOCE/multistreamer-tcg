    <title>Castle TCG | Gates Are Closed</title>
    <link rel="icon" type="image/png" href="https://cdn.codeoce.com/logo/logo_white.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;600;800&family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --void-bg: #05070a;
            --void-bg-alt: #0a0c10;
            --void-accent: #3faaff;
            --void-accent-rgb: 63, 170, 255;
            --void-text: #fcfaf7;
            --void-muted: #64748b;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--void-bg);
            color: var(--void-text);
            font-family: 'Inter', sans-serif;
            min-height: 100svh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 20, 24, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.1;
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% 100%, rgba(var(--void-accent-rgb), 0.07) 0%, transparent 70%),
                radial-gradient(circle at 20% 10%, rgba(var(--void-accent-rgb), 0.04) 0%, transparent 40%),
                radial-gradient(circle at 80% 15%, rgba(var(--void-accent-rgb), 0.03) 0%, transparent 40%),
                var(--void-bg);
            z-index: -1;
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: rgba(var(--void-accent-rgb), 0.5);
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.4; }
            100% { transform: translateY(-100vh) translateX(var(--drift)); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            width: 100%;
            max-width: 600px;
            padding: 0 24px;
        }

        .castle-wrap {
            width: 100%;
            max-width: 480px;
            position: relative;
            margin-bottom: -2px;
        }

        .mist {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140%;
            height: 80px;
            background: radial-gradient(ellipse 80% 100% at 50% 100%, rgba(var(--void-accent-rgb), 0.12) 0%, transparent 70%);
            filter: blur(8px);
            pointer-events: none;
            animation: mist-pulse 6s ease-in-out infinite;
        }

        @keyframes mist-pulse {
            0%, 100% { opacity: 0.7; transform: translateX(-50%) scaleX(1); }
            50%       { opacity: 1;   transform: translateX(-50%) scaleX(1.06); }
        }

        .portcullis-group {
            animation: portcullis-drop 1.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            transform-origin: top center;
        }

        @keyframes portcullis-drop {
            0%   { transform: translateY(-60px); opacity: 0; }
            60%  { transform: translateY(4px);   opacity: 1; }
            80%  { transform: translateY(-2px); }
            100% { transform: translateY(0);     opacity: 1; }
        }

        .gate-glow {
            animation: gate-glow-pulse 3s ease-in-out infinite;
        }

        @keyframes gate-glow-pulse {
            0%, 100% { opacity: 0.25; }
            50%       { opacity: 0.55; }
        }

        .text-block {
            text-align: center;
            width: 100%;
            background: rgba(10, 12, 16, 0.75);
            border: 1px solid rgba(var(--void-accent-rgb), 0.12);
            border-top: 1px solid rgba(var(--void-accent-rgb), 0.08);
            border-radius: 0 0 20px 20px;
            padding: 28px 36px 36px;
            backdrop-filter: blur(20px);
            animation: fade-up 1s 0.4s both ease;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .panel-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 2px;
        }

        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            color: var(--void-text);
        }

        .brand-name em {
            color: var(--void-accent);
            font-style: normal;
        }

        .eyebrow {
            font-family: 'Outfit', sans-serif;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--void-accent);
            margin-bottom: 10px;
            opacity: 0.7;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 14px;
            color: var(--void-text);
        }

        h1 span {
            color: var(--void-accent);
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--void-muted);
            line-height: 1.65;
            max-width: 380px;
            margin: 0 auto 24px;
        }

        .divider {
            width: 48px;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(var(--void-accent-rgb), 0.4), transparent);
            margin: 0 auto 22px;
        }

        .signup-form {
            display: flex;
            gap: 8px;
            max-width: 400px;
            margin: 0 auto 20px;
        }

        .signup-input {
            flex: 1;
            background: rgba(5, 7, 10, 0.7);
            border: 1.5px solid rgba(var(--void-accent-rgb), 0.2);
            border-radius: 12px;
            color: var(--void-text);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            padding: 11px 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-width: 0;
        }

        .signup-input::placeholder {
            color: var(--void-muted);
            opacity: 0.7;
        }

        .signup-input:focus {
            border-color: rgba(var(--void-accent-rgb), 0.55);
            box-shadow: 0 0 0 3px rgba(var(--void-accent-rgb), 0.08);
        }

        .signup-btn {
            background: rgba(var(--void-accent-rgb), 0.15);
            border: 1.5px solid rgba(var(--void-accent-rgb), 0.35);
            border-radius: 12px;
            color: var(--void-accent);
            font-family: 'Outfit', sans-serif;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 11px 18px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .signup-btn:hover {
            background: rgba(var(--void-accent-rgb), 0.25);
            border-color: rgba(var(--void-accent-rgb), 0.6);
            box-shadow: 0 0 16px rgba(var(--void-accent-rgb), 0.15);
        }

        .signup-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .signup-note {
            font-size: 0.7rem;
            color: var(--void-muted);
            margin-bottom: 24px;
            opacity: 0.6;
        }

        .signup-success {
            display: none;
            font-size: 0.82rem;
            color: var(--void-accent);
            font-weight: 600;
            margin-bottom: 24px;
            padding: 10px 16px;
            background: rgba(var(--void-accent-rgb), 0.07);
            border: 1px solid rgba(var(--void-accent-rgb), 0.2);
            border-radius: 10px;
        }

    </style>

                    <img src="https://cdn.codeoce.com/logo/logo_white.png" alt="Castle TCG" width="26" height="26" style="object-fit:contain;display:block;">
                </div>
                <span class="brand-name">Creator <em>Castle</em></span>
            </div>

            <div class="eyebrow">Coming Soon</div>
            <h1>The Gates Are <span>Closed</span></h1>
            <div class="divider"></div>
            <p class="subtitle">Something great is being built within these walls. Drop your email and we will let you know the moment the gates open.</p>

            <form class="signup-form" id="signup-form" novalidate>
                <input
                    type="email"
                    class="signup-input"
                    id="signup-email"
                    placeholder="your@email.com"
                    autocomplete="email"
                    required
                >
                <button type="submit" class="signup-btn" id="signup-btn">Notify me</button>
            </form>
            <div class="signup-success" id="signup-success">You are on the list. We will ring the bells when we are ready.</div>
            <p class="signup-note">No spam. Just one message when we launch.</p>

        </div>
    </div>

    <script>
        const container = document.getElementById('particles');
        for (let i = 0; i < 28; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = 1 + Math.random() * 2.5;
            p.style.cssText = `
                left: ${Math.random() * 100}%;
                bottom: -10px;
                width: ${size}px;
                height: ${size}px;
                animation-delay: ${Math.random() * 12}s;
                animation-duration: ${8 + Math.random() * 14}s;
                --drift: ${(Math.random() - 0.5) * 80}px;
                opacity: 0;
            `;
            container.appendChild(p);
        }

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value.trim();
            if (!email) return;

            const btn = document.getElementById('signup-btn');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const res = await fetch('/api/waitlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                if (!res.ok) throw new Error('failed');
            } catch {
                btn.disabled = false;
                btn.textContent = 'Notify me';
                return;
            }

            document.getElementById('signup-form').style.display = 'none';
            document.querySelector('.signup-note').style.display = 'none';
            document.getElementById('signup-success').style.display = 'block';
        });
    </script>
</body>
</html>
