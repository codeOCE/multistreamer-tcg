<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Castle TCG - OBS Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', sans-serif;
            width: 100vw;
            height: 100vh;
        }

        #stage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            pointer-events: none;
        }

        /* pack-scene: 400×560 */
        #pack-scene {
            position: relative;
            width: 400px;
            height: 560px;
        }

        /* Pack body — z-index ABOVE card so the card hides inside it */
        #pack-face {
            position: absolute;
            inset: 0;
            z-index: 8;
            transform: translateY(210px);
            transition: opacity 0.6s ease;
        }

        #pack-face img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Shine sweep */
        #pack-face::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
            background-size: 200% 200%;
            animation: shine-sweep 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes shine-sweep {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        /* Tear cap — top 10%, tears off upward */
        #tear-cap {
            position: absolute;
            top: 210px;
            left: 0;
            right: 0;
            height: 10%;
            overflow: hidden;
            z-index: 10;
            transition: transform 0.7s cubic-bezier(0.5, 0, 0.25, 1), opacity 0.5s ease;
        }

        #tear-cap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1000%;
            object-fit: contain;
            object-position: top center;
        }

        /* On rip: tear cap flies off, pack body clips the torn top strip away */
        .ripping #tear-cap {
            transform: translateY(-230%) rotate(-9deg) translateX(-10px);
            opacity: 0;
        }

        /* Clip pack body so the top 10% (where tear was) is now an open hole */
        .ripping #pack-face {
            clip-path: inset(10% 0 0 0);
        }

        /* 3D card flipper — z-index BELOW pack so card hides inside pack body */
        #card-flipper {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 250px;
            height: 350px;
            margin-left: -125px;
            margin-top: -175px;
            z-index: 6;
            transform-style: preserve-3d;
            opacity: 0;
            /* JS drives all transforms */
        }

        .card-face {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }

        /* Card back */
        #card-back {
            background: linear-gradient(145deg, #064e3b 0%, #065f46 30%, #047857 50%, #065f46 70%, #064e3b 100%);
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
        }

        #card-back::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(255, 255, 255, .03) 6px, rgba(255, 255, 255, .03) 12px);
        }

        .back-card {
            font-size: 48px;
            filter: drop-shadow(0 0 14px rgba(52, 211, 153, .5));
        }

        .back-text {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: .28em;
            color: rgba(255, 255, 255, .25);
            text-transform: uppercase;
        }

        /* Card front — pre-rotated 180° */
        #card-front {
            transform: rotateY(180deg);
        }

        #card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Shake */
        @keyframes pack-shake {

            0%,
            100% {
                transform: rotate(0deg) translateX(0);
            }

            20% {
                transform: rotate(-2.5deg) translateX(-5px);
            }

            40% {
                transform: rotate(2.5deg) translateX(5px);
            }

            60% {
                transform: rotate(-2deg) translateX(-3px);
            }

            80% {
                transform: rotate(2deg) translateX(3px);
            }
        }

        .shaking {
            animation: pack-shake .11s linear infinite;
        }

        /* Cosmic Effects */
        .cosmic-glow {
            filter: drop-shadow(0 0 20px #00f2fe) drop-shadow(0 0 40px #a855f7) !important;
        }

        /* Brutalist Effects */
        .brutalist-jitter {
            animation: brutalist-jitter 0.1s steps(2) infinite;
        }

        @keyframes brutalist-jitter {
            0% { transform: translate(5px, -5px) skew(5deg); }
            50% { transform: translate(-5px, 5px) skew(-5deg); }
        }
    </style>
</head>

<body>
    <div id="stage">
        <div id="pack-scene">

            <!-- Pack body (z-index 8 — card slides out from beneath it) -->
            <div id="pack-face">
                <img src="/pack.png" alt="Pack">
            </div>

            <!-- Tear cap -->
            <div id="tear-cap">
                <img src="/pack.png" alt="">
            </div>

            <!-- Card flipper (z-index 6 — below pack body) -->
            <div id="card-flipper">
                <div class="card-face" id="card-back">
                    <div class="back-card">🏰</div>
                    <div class="back-text">Castle TCG</div>
                </div>
                <div class="card-face" id="card-front">
                    <img id="card-img" src="" alt="">
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const STREAMER = urlParams.get('streamer');
        const TOKEN = urlParams.get('token');

        if (!STREAMER || !TOKEN) {
            document.body.style.cssText = 'background:rgba(0,0,0,.9)';
            document.body.innerHTML = '<p style="color:white;padding:24px;font-family:sans-serif">⛔ Invalid overlay URL. Missing streamer or token parameter.</p>';
            throw new Error('Missing streamer or token');
        }

        let isAnimating = false;
        let streamerConfig = null;

        async function initOverlay() {
            try {
                // Fetch streamer config for branding
                const res = await fetch(`${API_URL}/api/streamer/config?streamer=${STREAMER}`);
                if (res.ok) {
                    streamerConfig = await res.json();
                    applyBranding(streamerConfig);
                    
                    // Apply custom pack image if available
                    if (streamerConfig.pack_image_url) {
                        const packFaceImg = document.querySelector('#pack-face img');
                        const tearCapImg = document.querySelector('#tear-cap img');
                        if (packFaceImg) packFaceImg.src = streamerConfig.pack_image_url;
                        if (tearCapImg) tearCapImg.src = streamerConfig.pack_image_url;
                    }
                    
                    // Apply custom card back if available
                    if (streamerConfig.card_back_url) {
                        const cardBack = document.getElementById('card-back');
                        if (cardBack) {
                            cardBack.style.backgroundImage = `url(${streamerConfig.card_back_url})`;
                            cardBack.style.backgroundSize = 'cover';
                            cardBack.style.backgroundPosition = 'center';
                        }
                    }
                }
            } catch (e) {
                console.error("Failed to fetch streamer config:", e);
            }

            setInterval(poll, 1000);
        }

        function applyBranding(streamer) {
            const settings = streamer.settings || {};
            const cardBack = document.getElementById('card-back');
            const backText = document.querySelector('.back-text');
            const backFrog = document.querySelector('.back-card');

            if (settings.brand_color_primary && settings.brand_color_secondary) {
                // Approximate darker/lighter shades based on provided hex colors
                const primary = settings.brand_color_primary;
                const secondary = settings.brand_color_secondary;
                cardBack.style.background = `linear-gradient(145deg, ${secondary} 0%, ${primary} 50%, ${secondary} 100%)`;
                backFrog.style.filter = `drop-shadow(0 0 14px ${primary})`;
            }

            if (settings.brand_name) {
                backText.innerText = settings.brand_name;
            }
        }

        async function poll() {
            if (isAnimating) return;
            try {
                const res = await fetch(`${API_URL}/api/obs/next?streamer=${STREAMER}&token=${TOKEN}`);
                if (res.status === 403) {
                    console.error('Invalid token - overlay access denied');
                    document.body.style.cssText = 'background:rgba(0,0,0,.9)';
                    document.body.innerHTML = '<p style="color:red;padding:24px;font-family:sans-serif">⛔ Invalid token. Please regenerate your overlay URL.</p>';
                    return;
                }
                const data = await res.json();
                if (data && data.cards) playReveal(data.cards);
            } catch (e) {
                console.error('Poll error:', e);
            }
        }

        initOverlay();

        // pack-scene is 560px tall, card is 350px tall centred → card top at 105px
        // Tear hole starts at 10% = 56px from top
        // We want card to START hidden inside pack (below tear line) and slide up through it.
        //
        // translateY offset so card top aligns with the tear hole edge (56px):
        //   card centre normally at 280px, card top = 280 - 175 = 105px
        //   to push card top down to 56px+350=406px start → translateY = 406-105 = +301px
        //   then slide to translateY = -60px so card sticks mostly out above the pack

        async function playReveal(card) {
            isAnimating = true;

            const scene = document.getElementById('pack-scene');
            const packFace = document.getElementById('pack-face');
            const flipper = document.getElementById('card-flipper');
            const cardImg = document.getElementById('card-img');
            const animStyle = streamerConfig?.pack_animation_style || 'style1';

            cardImg.src = card.image_url || '';

            // ── AUDIO ──
            const audio = new Audio('/packopensound.wav');
            audio.load();

            // ── CONSUME IMMEDIATELY ──
            fetch(`${API_URL}/api/obs/consume?streamer=${STREAMER}&token=${TOKEN}&id=${card.user_card_id}`, { method: 'POST' });

            // ── RESET visual state ──
            scene.style.opacity = '0';
            scene.style.transition = 'none';
            scene.classList.remove('ripping', 'shaking', 'brutalist-jitter');
            flipper.classList.remove('cosmic-glow');
            packFace.style.opacity = '1';
            packFace.style.transform = 'translateY(210px)';
            packFace.style.transition = '';

            flipper.style.zIndex = '6';
            setFlip(flipper, { opacity: 1, rotateY: 0, translateY: 300, scale: 1, transition: 'none' });
            await wait(50);

            // PHASE 1 — Pack fades in
            scene.style.transition = 'opacity 0.5s ease';
            scene.style.opacity = '1';
            audio.play().catch(e => console.warn('Audio play failed:', e));
            await wait(700);

            // PHASE 2 — Shake
            scene.classList.add('shaking');
            await wait(950);
            scene.classList.remove('shaking');
            await wait(200);

            // PHASE 3 — Top tears off
            scene.classList.add('ripping');
            await wait(800);

            // PHASE 4 — Card Reveal Sequence Branching
            if (animStyle === 'style2') { // COSMIC BURST
                // Rapid slide up
                setFlip(flipper, {
                    opacity: 1, rotateY: 360, translateY: -120, scale: 1.2,
                    transition: 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)'
                });
                await wait(600);
                
                flipper.style.zIndex = '20';
                flipper.classList.add('cosmic-glow');
                setFlip(flipper, {
                    opacity: 1, rotateY: 720, translateY: 150, scale: 1.5,
                    transition: 'transform 1.0s cubic-bezier(0.34, 1.56, 0.64, 1)'
                });
                await wait(1000);

            } else if (animStyle === 'style3') { // BRUTALIST
                scene.classList.add('brutalist-jitter');
                setFlip(flipper, {
                    opacity: 1, rotateY: 0, translateY: -100, scale: 1,
                    transition: 'transform 0.4s steps(4)'
                });
                await wait(400);
                
                flipper.style.zIndex = '20';
                setFlip(flipper, {
                    opacity: 1, rotateY: 180, translateY: 150, scale: 1.3,
                    transition: 'transform 0.3s steps(3)'
                });
                await wait(300);
                scene.classList.remove('brutalist-jitter');
                await wait(400);

            } else { // STYLE 1 / STANDARD
                // Card slides up through the tear hole
                setFlip(flipper, {
                    opacity: 1, rotateY: 0, translateY: -100, scale: 1,
                    transition: 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)'
                });
                await wait(900);

                flipper.style.zIndex = '20';
                setFlip(flipper, {
                    opacity: 1, rotateY: 0, translateY: 150, scale: 1.3,
                    transition: 'transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1)'
                });
                await wait(800);

                setFlip(flipper, {
                    opacity: 1, rotateY: 180, translateY: 150, scale: 1.3,
                    transition: 'transform 1.1s cubic-bezier(0.4, 0, 0.2, 1)'
                });
            }

            // PHASE 5 — Pack drops away (common for all)
            packFace.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 1, 1), opacity 0.4s ease';
            packFace.style.transform = 'translateY(900px)';
            packFace.style.opacity = '0';
            await wait(750);

            // PHASE 6 — Hold on revealed card
            await wait(5000);

            // PHASE 7 — Fade whole scene
            scene.style.transition = 'opacity 0.5s ease';
            scene.style.opacity = '0';
            await wait(600);

            scene.classList.remove('ripping', 'brutalist-jitter');
            flipper.classList.remove('cosmic-glow');
            isAnimating = false;
        }

        function setFlip(el, { opacity, rotateY, translateY, scale, transition }) {
            el.style.transition = transition;
            el.style.opacity = opacity;
            el.style.transform = `rotateY(${rotateY}deg) translateY(${translateY}px) scale(${scale})`;
        }

        function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
    </script>
</body>

</html>
