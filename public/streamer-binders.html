<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="castle-public-url" content="https://tcg.creatorcastle.gg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binders · Castle TCG</title>
    <link rel="icon" type="image/png" href="https://cdn.codeoce.com/logo/logo_white.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/tailwind-built.css">

    <style>
        .hidden { display: none !important; }

        /* streamer-nav.js elements use hidden md:flex — restore display on desktop */
        @media (min-width: 768px) {
            #streamer-nav-links { display: flex !important; }
            #streamer-nav-identity { display: flex !important; }
            #streamer-nav-left { display: flex !important; }
        }

        /* ── Page layout ── */
        #sb-root { min-height: 100vh; padding-top: 80px; }

        /* ── Two-column body ── */
        #sb-body {
            display: flex;
            gap: 32px;
            align-items: flex-start;
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 24px 80px;
        }

        #sb-main { flex: 1; min-width: 0; }

        /* ── Section headers ── */
        .sb-section-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .sb-section-title {
            font-size: 0.52rem;
            font-weight: 800;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--void-muted);
        }

        /* ── Binder grid ── */
        .sb-binder-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 28px 24px;
            margin-bottom: 40px;
        }

        @media (max-width: 900px) {
            .sb-binder-grid { grid-template-columns: repeat(3, 1fr); gap: 22px 16px; }
            #sb-body { gap: 24px; }
        }

        @media (max-width: 560px) {
            .sb-binder-grid { grid-template-columns: repeat(2, 1fr); gap: 16px 10px; }
            #sb-page-header { padding: 20px 16px 0; }
            #sb-body { padding: 20px 16px 60px; }
        }

        /* ── Binder tile ── */
        .binder-tile {
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            position: relative;
        }

        .binder-book {
            position: relative;
            aspect-ratio: 3/4;
            background: rgb(var(--binder-accent-rgb));
            border-radius: 5px 14px 14px 5px;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
            box-shadow:
                -4px 0 10px rgba(0, 0, 0, 0.45),
                0 8px 28px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .binder-tile:hover .binder-book {
            transform: translateY(-8px) scale(1.025);
            box-shadow:
                -4px 0 10px rgba(0, 0, 0, 0.45),
                0 28px 64px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(var(--binder-accent-rgb), 0.25),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .binder-book--empty {
            background: transparent !important;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 5px 14px 14px 5px;
            box-shadow: none !important;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.25s, background 0.25s;
        }

        .binder-tile:hover .binder-book--empty {
            border-color: rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.02) !important;
            transform: none;
            box-shadow: none !important;
        }

        .binder-spine-strip {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 18px;
            background: rgba(0, 0, 0, 0.32);
            z-index: 2;
            box-shadow: inset -3px 0 6px rgba(0, 0, 0, 0.4), 2px 0 0 rgba(255, 255, 255, 0.05);
        }

        .binder-face {
            position: absolute;
            left: 18px; right: 0; top: 0; bottom: 0;
        }

        .binder-weave {
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 3px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 3px);
        }

        .binder-sheen {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                rgba(255,255,255,0.11) 0%,
                rgba(255,255,255,0.03) 30%,
                transparent 55%,
                rgba(0,0,0,0.1) 100%);
        }

        .binder-stitch {
            position: absolute;
            inset: 9px 11px 9px 5px;
            border: 1.5px dashed rgba(255, 255, 255, 0.13);
            border-radius: 2px 10px 10px 2px;
            pointer-events: none;
        }

        .binder-zipper {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 9px; height: 18px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 0 0 5px 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: none;
            z-index: 4;
        }

        .binder-zipper::after {
            content: '';
            position: absolute;
            top: 6px; left: 50%;
            transform: translateX(-50%);
            width: 4px; height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
        }

        .binder-etched {
            position: absolute;
            left: 0; right: 0;
            bottom: 20%;
            padding: 0 16px;
            text-align: center;
        }

        .binder-etch-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: clamp(0.6rem, 1.8vw, 0.9rem);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            line-height: 1.2;
            word-break: break-word;
        }

        .binder-etch-handle {
            font-size: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .binder-avatar {
            position: absolute;
            top: 42%; left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(36px, 36%, 68px);
            height: auto;
            aspect-ratio: 1;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            z-index: 5;
        }

        .binder-card-count {
            position: absolute;
            bottom: 13px; right: 14px;
            font-size: 0.48rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .binder-label { padding: 0 4px; }

        .binder-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            color: var(--void-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .binder-meta {
            font-size: 0.58rem;
            font-weight: 600;
            color: var(--void-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .binder-meta .accent-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgb(var(--binder-accent-rgb));
            display: inline-block;
            flex-shrink: 0;
        }

        /* ── Achievements panel ── */
        #sb-achievements-panel {
            width: 220px;
            flex-shrink: 0;
            position: sticky;
            top: 96px;
            align-self: flex-start;
            max-height: calc(100vh - 110px);
            overflow-y: auto;
            scrollbar-width: none;
        }
        #sb-achievements-panel::-webkit-scrollbar { display: none; }

        @media (max-width: 1040px) { #sb-achievements-panel { display: none; } }

        #sb-achievements-list { display: flex; flex-direction: column; gap: 6px; }

        .sb-ach-card {
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(10, 12, 16, 0.6);
            padding: 10px;
            display: flex;
            gap: 9px;
            align-items: flex-start;
            transition: border-color 0.2s, background 0.2s;
        }

        .sb-ach-card.unlocked {
            border-color: rgba(var(--void-accent-rgb), 0.2);
            background: rgba(var(--void-accent-rgb), 0.04);
        }

        .sb-ach-card.locked { opacity: 0.45; }

        .sb-ach-icon {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            border: 1px solid rgba(var(--void-accent-rgb), 0.3);
            background: rgba(var(--void-accent-rgb), 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .sb-ach-card.locked .sb-ach-icon {
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            filter: grayscale(1);
        }

        .sb-ach-body { min-width: 0; flex: 1; }

        .sb-ach-title {
            font-size: 0.54rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--void-text);
            line-height: 1.3;
        }

        .sb-ach-meta {
            margin-top: 2px;
            font-size: 0.46rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--void-muted);
        }

        .sb-ach-card.unlocked .sb-ach-meta { color: rgba(var(--void-accent-rgb), 0.7); }

        .sb-ach-bar-track {
            margin-top: 6px;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            overflow: hidden;
        }

        .sb-ach-bar-fill {
            height: 100%;
            background: rgba(var(--void-accent-rgb), 0.7);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        /* drag ghost */
        .sb-sort-ghost { opacity: 0.35; }

        /* draggable cursor on the grid */
        #sb-all-grid { cursor: grab; }
        #sb-all-grid:active { cursor: grabbing; }

        /* ── Loading / auth states ── */
        #sb-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            gap: 16px;
        }

        .sb-spinner {
            width: 32px; height: 32px;
            border: 2px solid rgba(var(--void-accent-rgb), 0.15);
            border-top-color: var(--void-accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #sb-signin {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            gap: 20px;
            text-align: center;
            padding: 40px;
        }

        #sb-signin h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: -0.03em;
        }

        #sb-signin p {
            font-size: 0.7rem;
            color: var(--void-muted);
            max-width: 340px;
            line-height: 1.6;
        }
    </style>
    <script src="/castle-prefs.js"></script>
</head>
